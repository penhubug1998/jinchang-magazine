<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#7a1717">
<title>中国人民银行金昌市分行离退休干部电子期刊</title>
<link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong","Microsoft YaHei",serif;color:#f8ead0;background:radial-gradient(circle at 20% 12%,rgba(205,161,83,.14),transparent 24%),radial-gradient(circle at 82% 88%,rgba(142,28,28,.16),transparent 32%),linear-gradient(145deg,#352d27,#1d1917 65%,#141210);display:flex;align-items:center;justify-content:center;padding:24px}
.wrap{text-align:center;max-width:640px;width:100%}
.mark{width:76px;height:76px;margin:0 auto 18px;border-radius:50%;background:#8c1c1a;border:3px solid #e6ba63;display:grid;place-items:center;font-size:40px;color:#ffe7ad;font-weight:700;box-shadow:0 12px 28px rgba(0,0,0,.35)}
h1{font-size:24px;letter-spacing:.08em;margin:0 0 8px;color:#ffe7ad}
.sub{color:rgba(255,239,215,.66);font-size:13px;margin:0 0 28px;line-height:1.8}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{display:block;text-decoration:none;border:1px solid rgba(255,255,255,.14);background:rgba(255,248,235,.06);border-radius:18px;padding:26px 16px;color:#f8ead3;transition:transform .18s,background .18s}
.card:hover{transform:translateY(-3px);background:rgba(255,248,235,.12)}
.card b{display:block;font-size:18px;letter-spacing:.06em;color:#ffe7ad}
.card span{display:block;margin-top:8px;font-size:12.5px;color:rgba(255,239,215,.62);line-height:1.7}
@media(max-width:560px){.cards{grid-template-columns:1fr}}
.foot{margin-top:30px;font-size:11px;color:rgba(255,239,215,.45)}
</style>
</head>
<body>
<div class="wrap">
  <div class="mark">刊</div>
  <h1>中国人民银行金昌市分行<br>离退休干部电子期刊</h1>
  <p class="sub">银发丹心映晚晴 · 清风护航伴新秋<br>3D 仿真翻页 · 语音朗读 · 字号调节 · 上下期切换</p>
  <div class="cards">
    <a class="card" href="./1/"><b>第一期</b><span>深学铸魂固初心<br>精管护航安伏夏</span></a>
    <a class="card" href="./2/"><b>第二期</b><span>银发丹心映晚晴<br>清风护航伴新秋</span></a>
  </div>
  <div class="foot">中国人民银行金昌市分行离退休干部电子期刊 · 2026</div>
</div>
</body>
</html>
