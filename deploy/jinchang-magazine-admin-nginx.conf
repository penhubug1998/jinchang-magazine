# 将下面的 location 合并到 www.jilv.online 的 HTTPS server 中。
# 管理端自身已经提供登录页和 HttpOnly 会话；这里不要配置 auth_basic，
# 否则用户会先遇到浏览器基础认证，再遇到管理端登录页。

location = /new-jc-magazine-admin {
    return 301 /new-jc-magazine-admin/;
}

location ^~ /new-jc-magazine-admin/ {
    client_max_body_size 100m;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    proxy_pass http://127.0.0.1:4180/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /new-jc-magazine-admin;
    proxy_connect_timeout 15s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
}
