name: Alpha14 contract cleanup

on:
  push:
    branches:
      - fix/ci-tts-baseline-20260906
    paths:
      - .github/workflows/alpha14-contract-cleanup.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ci-tts-baseline-20260906
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch obsolete Alpha14 preview-mode contract
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'scripts/alpha14-browser-regression-v3.mjs';
          const src = fs.readFileSync(file, 'utf8');
          const needle = `await ev("document.getElementById('expandReaderPreview').click()");await sleep(50);assert(await ev("document.getElementById('previewCard').classList.contains('reader-expanded')"),'放大预览未生效');let shot=await cdp.send('Page.captureScreenshot',{format:'png',captureBeyondViewport:false});await writeFile(path.join(outDir,'desktop-1366x768-reader-expanded.png'),Buffer.from(shot.data,'base64'));await ev("document.getElementById('expandReaderPreview').click();document.getElementById('quickPreviewBtn').click()");assert(await ev("window.__V3_STUDIO__.state.previewMode==='quick'"),'快速结构模式切换失败');await ev("document.getElementById('builtPreviewBtn').click()");assert(await ev("window.__V3_STUDIO__.state.previewMode==='built'"),'真实 Reader 模式切回失败');`;
          const replacement = `await ev("document.getElementById('expandReaderPreview').click()");await sleep(50);assert(await ev("document.getElementById('previewCard').classList.contains('reader-expanded')"),'放大预览未生效');let shot=await cdp.send('Page.captureScreenshot',{format:'png',captureBeyondViewport:false});await writeFile(path.join(outDir,'desktop-1366x768-reader-expanded.png'),Buffer.from(shot.data,'base64'));await ev("document.getElementById('expandReaderPreview').click()");await sleep(30);assert(await ev("window.__V3_STUDIO__.state.previewMode==='built' && !document.getElementById('previewCard').classList.contains('reader-expanded')"),'退出全屏后真实 Reader 状态异常');`;
          if (!src.includes(needle)) throw new Error('Alpha14 obsolete preview-mode contract not found');
          fs.writeFileSync(file, src.replace(needle, replacement));
          NODE
          git diff --check
      - name: Run Alpha14 browser regression
        env:
          CHROMIUM: /usr/bin/google-chrome
        run: |
          command -v xvfb-run
          node scripts/alpha14-browser-regression-bootstrap-v3.mjs
      - name: Commit verified patch and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/alpha14-contract-cleanup.yml
          git add scripts/alpha14-browser-regression-v3.mjs
          git commit -m "test(alpha14): align preview contract with single Reader"
          git push origin HEAD:fix/ci-tts-baseline-20260906
