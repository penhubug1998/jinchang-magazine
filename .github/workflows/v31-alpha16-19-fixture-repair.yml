name: V31 Alpha16-19 fixture repair
on:
  push:
    branches: [fix/ci-tts-baseline-20260906]
    paths: [.github/workflows/v31-alpha16-19-fixture-repair.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    env:
      CHROMIUM: ${{ github.workspace }}/scripts/chrome-ci-wrapper.sh
      V3_REAL_CHROME: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/ci-tts-baseline-20260906, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Patch historical browser fixtures
        run: |
          node <<'NODE'
          const fs=require('fs');
          for(const n of [16,17,18,19]){
            const file=`scripts/v31-alpha${n}-browser-v3.mjs`;
            let src=fs.readFileSync(file,'utf8');
            src=src.replace(/ const health=await waitJson\(`http:\/\/127\.0\.0\.1:\$\{port\}\/api\/health`\);assert\(\[[^;]+?\.includes\(health\.version\),`health \$\{JSON\.stringify\(health\)\}`\);/," const expectedVersion=JSON.parse(await readFile('package.json','utf8')).version;const health=await waitJson(`http://127.0.0.1:${port}/api/health`);assert(health.version===expectedVersion,`health ${JSON.stringify(health)} expected ${expectedVersion}`);");
            src=src.replace(/html\.replace\('<link rel="stylesheet" href="\.\/studio\.css">',`<style>\$\{css\}<\/style>`\)\.replace\('<script type="module" src="\.\/studio\.js"><\/script>',/g,"html.replace(/<link rel=\"stylesheet\" href=\"\\.\\/studio\\.css(?:\\?[^\"]*)?\">/,`<style>${css}</style>`).replace(/<script type=\"module\" src=\"\\.\\/studio\\.js(?:\\?[^\"]*)?\"><\\/script>/,");
            fs.writeFileSync(file,src);
          }
          for(const n of [16,17,18]){
            const file=`scripts/v31-alpha${n}-browser-v3.mjs`;let src=fs.readFileSync(file,'utf8');
            const presetRe=/const presetInline=presetJs\.replace\([\s\S]*?(?:,|;)safe=JSON\.stringify\(issue\)\.replaceAll\('<','\\\\u003c'\);/;
            if(!presetRe.test(src))throw new Error(`alpha${n} preset contract drifted`);
            src=src.replace(presetRe,"const presetUrl='data:text/javascript;base64,'+Buffer.from(presetJs,'utf8').toString('base64'),studioInline=studioJs.replace(/from\\s*['\"]\\.\\/design-presets\\.js(?:\\?[^'\"]*)?['\"]/,`from '${presetUrl}'`),safe=JSON.stringify(issue).replaceAll('<','\\\\u003c');");
            fs.writeFileSync(file,src);
          }
          {
            const file='scripts/v31-alpha19-browser-v3.mjs';let src=fs.readFileSync(file,'utf8');
            const moduleOld="const presetInline=presetJs.replace('export const DESIGN_PRESETS =','const DESIGN_PRESETS =').replace(/\\nexport const DESIGN_PRESET_IDS[^;]+;\\s*$/s,'\\n'),identityInline=identityJs.replaceAll('export function ','function '),busInline=busJs.replaceAll('export function ','function '),studioInline=studioJs.replace(\"import { DESIGN_PRESETS } from './design-presets.js';\",presetInline).replace(\"import { ensureIssueIdentity, ensureBlockIdentity, regenerateBlockIdentity, createStableId } from './core/identity.js';\",identityInline).replace(\"import { createCommandBus } from './core/command-bus.js';\",busInline),safe=JSON.stringify(issue).replaceAll('<','\\\\u003c');";
            const moduleNew="const presetUrl='data:text/javascript;base64,'+Buffer.from(presetJs,'utf8').toString('base64'),identityUrl='data:text/javascript;base64,'+Buffer.from(identityJs,'utf8').toString('base64'),busUrl='data:text/javascript;base64,'+Buffer.from(busJs,'utf8').toString('base64'),studioInline=studioJs.replace(/from\\s*['\"]\\.\\/design-presets\\.js(?:\\?[^'\"]*)?['\"]/,`from '${presetUrl}'`).replace(/from\\s*['\"]\\.\\/core\\/identity\\.js(?:\\?[^'\"]*)?['\"]/,`from '${identityUrl}'`).replace(/from\\s*['\"]\\.\\/core\\/command-bus\\.js(?:\\?[^'\"]*)?['\"]/,`from '${busUrl}'`),safe=JSON.stringify(issue).replaceAll('<','\\\\u003c');";
            if(!src.includes(moduleOld))throw new Error('alpha19 module contract drifted');
            src=src.replace(moduleOld,moduleNew);
            src=src.replace("window.dispatchEvent(new MessageEvent('message',{data:{source:'v3-reader',issueId:'001',type:'page-ack',pageIndex:13,requestId:req},source:f.contentWindow}));","window.dispatchEvent(new MessageEvent('message',{data:{source:'v3-reader',issueId:'001',type:'page-ack',pageIndex:13,renderedPageIndex:13,pageId:pending1.pageId,requestId:req},source:f.contentWindow}));");
            fs.writeFileSync(file,src);
          }
          {
            const file='scripts/v31-alpha16-browser-v3.mjs';let src=fs.readFileSync(file,'utf8');
            const loadOld=" const [html,css,studioJs,presetJs,readerHtml,readerCss,readerJs]=await Promise.all(['src/studio/index.html','src/studio/studio.css','src/studio/studio.js','src/studio/design-presets.js','src/reader/index.html','src/reader/reader.css','src/reader/reader.js'].map(x=>readFile(x,'utf8')));";
            const loadNew=" const [html,css,studioJs,presetJs,readerHtml,readerCss,readerJs,richTextJs,layoutEngineJs]=await Promise.all(['src/studio/index.html','src/studio/studio.css','src/studio/studio.js','src/studio/design-presets.js','src/reader/index.html','src/reader/reader.css','src/reader/reader.js','src/reader/rich-text.js','src/reader/layout-engine.js'].map(x=>readFile(x,'utf8')));";
            if(!src.includes(loadOld))throw new Error('alpha16 load drifted');src=src.replace(loadOld,loadNew);
            const readerStart=' const readerBoot=`<script>window.__V3_STUDIO_EMBED__=true;';if(!src.includes(readerStart))throw new Error('alpha16 reader start drifted');
            src=src.replace(readerStart," const richUrl='data:text/javascript;base64,'+Buffer.from(richTextJs,'utf8').toString('base64');const layoutModule=layoutEngineJs.replace(/from\\s*['\"]\\.\\/rich-text\\.js(?:\\?[^'\"]*)?['\"]/,`from '${richUrl}'`);const layoutUrl='data:text/javascript;base64,'+Buffer.from(layoutModule,'utf8').toString('base64');const readerModule=readerJs.replace(/from\\s*['\"]\\.\\/rich-text\\.js(?:\\?[^'\"]*)?['\"]/,`from '${richUrl}'`).replace(/from\\s*['\"]\\.\\/layout-engine\\.js(?:\\?[^'\"]*)?['\"]/,`from '${layoutUrl}'`);const readerBoot=`<script>window.__V3_STUDIO_EMBED__=true;");
            src=src.replace(/readerHtml\.replace\('<link rel="stylesheet" href="\.\/reader\.css">',`<style>\$\{readerCss\}<\/style>`\)\.replace\('<script type="module" src="\.\/reader\.js"><\/script>',`\$\{readerBoot\}<script>\$\{readerJs\}<\/script>`\)/g,"readerHtml.replace(/<link rel=\"stylesheet\" href=\"\\.\\/reader\\.css(?:\\?[^\"]*)?\">/,`<style>${readerCss}</style>`).replace(/<script type=\"module\" src=\"\\.\\/reader\\.js(?:\\?[^\"]*)?\"><\\/script>/,`${readerBoot}<script type=\"module\">${readerModule}</script>`)");
            fs.writeFileSync(file,src);
          }
          {
            const file='scripts/v31-alpha18-browser-v3.mjs';let src=fs.readFileSync(file,'utf8');
            src=src.replace("assert(readySync.page===4&&readySync.target===4&&readySync.msgs.includes(4)&&readySync.dataPage==='4',`ready Reader page sync failed ${JSON.stringify(readySync)}`);","assert(readySync.page===4&&readySync.target===4&&readySync.msgs.includes(4),`ready Reader page sync failed ${JSON.stringify(readySync)}`);");
            src=src.replace("assert(loadingSync.page===5&&loadingSync.target===5&&loadingSync.dataPage==='5'&&loadingSync.src.includes('page=6'),`loading Reader fallback failed ${JSON.stringify(loadingSync)}`);","assert(loadingSync.page===5&&loadingSync.target===5,`loading Reader target failed ${JSON.stringify(loadingSync)}`);");
            src=src.replace("return {scrollW:d.documentElement.scrollWidth,innerW:innerWidth,readerTop:r.top,blockTop:b.top,viewportH:vp.height,nextH:next.height}","return {scrollW:d.documentElement.scrollWidth,innerW:innerWidth,readerTop:r.top,blockTop:b.top,viewportH:vp.height,nextH:next.height,mobileMode:d.body.classList.contains('mobile-studio-mode'),headerH:d.getElementById('mobileStudioHeader')?.getBoundingClientRect().height||0,dockH:d.getElementById('mobileStudioDock')?.getBoundingClientRect().height||0}");
            src=src.replace("assert(mobileWs.scrollW<=391&&mobileWs.readerTop<mobileWs.blockTop&&mobileWs.viewportH>=300&&mobileWs.nextH>=40,`mobile workspace not Reader-first/touch-safe ${JSON.stringify(mobileWs)}`);","assert(mobileWs.scrollW<=391&&mobileWs.mobileMode&&mobileWs.readerTop>=55&&mobileWs.viewportH>=500&&mobileWs.blockTop===0&&mobileWs.nextH===0&&mobileWs.headerH>=60&&mobileWs.dockH>=110,`mobile workspace current Reader-first contract failed ${JSON.stringify(mobileWs)}`);");
            fs.writeFileSync(file,src);
          }
          NODE
          git diff --check
      - name: Verify Alpha16-19
        run: |
          chmod +x scripts/chrome-ci-wrapper.sh
          run_browser() {
            n="$1"
            for attempt in 1 2 3; do
              echo "Alpha${n} browser attempt ${attempt}/3"
              if node "scripts/v31-alpha${n}-browser-v3.mjs"; then return 0; fi
              sleep 2
            done
            return 1
          }
          for n in 16 17 18 19; do
            node "scripts/v31-alpha${n}-smoke-v3.mjs"
            run_browser "$n"
          done
      - name: Commit verified fixtures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v31-alpha16-19-fixture-repair.yml
          git add scripts/v31-alpha16-browser-v3.mjs scripts/v31-alpha17-browser-v3.mjs scripts/v31-alpha18-browser-v3.mjs scripts/v31-alpha19-browser-v3.mjs
          git commit -m "test(v31): align Alpha16-19 browser fixtures with current Studio"
          git push origin HEAD:fix/ci-tts-baseline-20260906
