name: V3 checks
on:
  pull_request:
  push:
    branches: [main, "feat/v3-**"]
jobs:
  # The job name is the branch-protection status check context, so it stays
  # "verify".
  #
  # The gate is deliberately narrow: every step here protects a risk that a
  # producer would feel (lost or overwritten copy, dropped imported content,
  # a broken publish or a broken reader on a real viewport).
  #
  # Suite policy (2026-09-12): 26 browser suites were retired. 10 of the 12
  # previously-advisory suites only failed because the test looked for markup
  # or APIs that no longer exist ("bootstrap contract drifted", "Reader fixture
  # tags not found", "reading 'openIssue'") - they reported drift in the
  # harness, not a defect in the product, and had never once passed in CI.
  # A suite that fails twice for a non-product reason is retired, not repaired.
  # test:reader-capabilities asserts the built Reader bundle still carries the
  # reader features (image lightbox, AI summary typing) after a 2026-09-12
  # incident where a published issue shipped an older reader.js.
  # test:v31-canvas-marquee-browser was added on 2026-09-12: the canvas free-editing
  # layer (marquee select, drag readout) has no other browser-level coverage.
  # Retired suites keep their npm scripts; run one explicitly when touching its
  # area. See RETIRED-BROWSER-SUITES.md.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # findChromium() 只读取 CHROMIUM，不读取运行器已设置的 CHROME_BIN。
      # 不显式指定时它会先命中 /usr/bin/chromium（Chromium snapshot 构建），
      # 该构建在无头模式下不会暴露 DevTools 端口，导致 PDF 导出失败。
      CHROMIUM: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Browser runtime preflight
        run: |
          set -euo pipefail
          test -x "$CHROMIUM"
          "$CHROMIUM" --version

      # ---------------------------------------------------------------- required
      - run: npm run test:narration-scope
      - run: npm run test:import-safety
      - run: npm run test:import-completeness
      - run: npm run test:canvas-editing
      - run: npm run test:reader-capabilities
      - run: npm run test:publication-share
      - run: npm run test:publication-pdf
      - run: npm run test:production-preflight
      - run: npm run test:workflow-usability
      - run: npm run test:default-templates
      - name: Core verification
        run: npm run verify:core
      - name: Browser regression (required, curated)
        # The ten suites that cover a producer-visible surface across real viewports.
        # Each is reported individually so one run yields the whole failure list.
        run: |
          set -uo pipefail
          suites="test:browser:001 test:browser test:beta1-browser test:v31-alpha1-browser test:v31-alpha2-browser test:v31-alpha16-browser test:v31-alpha22-browser test:v31-alpha23-browser test:v31-alpha26-browser test:v31-alpha10-browser test:v31-canvas-marquee-browser"
          failed=0
          for suite in $suites; do
            log="$(mktemp)"
            if npm run --silent "$suite" >"$log" 2>&1; then
              echo "PASS  $suite"
            else
              echo "FAIL  $suite"
              failed=1
              echo "::group::$suite failure"
              grep -E '^Error:|^AssertionError|^TypeError|Error:' "$log" | head -5 || tail -10 "$log"
              echo "::endgroup::"
            fi
            rm -f "$log"
          done
          [ "$failed" -eq 0 ]
      - name: Verify complete repository media
        run: npm run media:check -- --strict

      # -------------------------------------------------------------- always runs
      - name: Generate production audit
        if: always()
        run: npm run audit:v3
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: v3-release-audit
          path: reports/
          if-no-files-found: ignore
      - name: Upload browser regression
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: v3-browser-regression
          path: .tmp-v3-browser-*/
          if-no-files-found: ignore
      - name: Upload Beta1 block matrix regression
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: v3-beta1-block-matrix-regression
          path: .tmp-v3-browser-preview-beta1-matrix/
          if-no-files-found: ignore
      - name: Upload V3.1 Alpha2 style regression
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: v31-alpha2-style-regression
          path: .tmp-v3-browser-preview-v31-style-matrix/
          if-no-files-found: ignore
      - name: Upload V3.1 Alpha1 layout regression
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: v31-alpha1-layout-regression
          path: .tmp-v3-browser-preview-v31-layout-matrix/
          if-no-files-found: ignore
      - name: Generate V3.0.0 final readiness
        if: always()
        run: npm run final:status
      - name: Upload V3.0.0 final readiness
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: v3-final-readiness
          path: |
            reports/v3-final-readiness.json
            reports/v3-final-readiness.md
          if-no-files-found: ignore
