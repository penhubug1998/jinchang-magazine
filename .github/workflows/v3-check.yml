name: V3 checks
on:
  pull_request:
  push:
    branches: [main, "feat/v3-**"]
jobs:
  # The job name is the branch-protection status check context, so it stays
  # "verify" even though the gate is now layered.
  #
  # Required steps are the ones measured to pass today; they block the merge.
  # The advisory step below runs the browser suites that have never executed in
  # CI and therefore drifted. It reports red but does not block. Promote a suite
  # from advisory to required as it is repaired.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # findChromium() 只读取 CHROMIUM，不读取运行器已设置的 CHROME_BIN。
      # 不显式指定时它会先命中 /usr/bin/chromium（Chromium snapshot 构建），
      # 该构建在无头模式下不会暴露 DevTools 端口，导致 PDF 导出失败。
      CHROMIUM: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Browser runtime preflight
        run: |
          set -euo pipefail
          test -x "$CHROMIUM"
          "$CHROMIUM" --version

      # ---------------------------------------------------------------- required
      - run: npm run test:narration-scope
      - run: npm run test:import-safety
      - run: npm run test:publication-share
      - run: npm run test:publication-pdf
      - run: npm run test:production-preflight
      - run: npm run test:workflow-usability
      - run: npm run test:default-templates
      - name: Core verification
        run: npm run verify:core
      - name: Browser regression (required)
        # reader 001/002 plus every suite measured to pass on this runner.
        # Reports all failures instead of stopping at the first one.
        run: |
          set -uo pipefail
          suites="test:browser:001 test:browser test:beta1-browser test:v31-alpha16-browser test:v31-alpha19-browser test:v31-alpha20-browser test:v31-alpha21-browser test:v31-alpha22-browser test:v31-alpha22-1-browser test:v31-alpha23-browser test:v31-alpha26-browser test:v31-alpha1-browser test:v31-alpha2-browser test:v31-alpha3-browser test:v31-alpha4-browser test:v31-alpha5-browser test:v31-alpha6-browser test:v31-alpha7-browser test:v31-alpha8-browser test:v31-alpha9-browser test:v31-alpha10-browser test:v31-alpha11-browser test:v31-alpha12-browser test:v31-alpha13-browser"
          failed=0
          for suite in $suites; do
            if npm run --silent "$suite"; then echo "PASS  $suite"; else echo "FAIL  $suite"; failed=1; fi
          done
          [ "$failed" -eq 0 ]
      - name: Verify complete repository media
        run: npm run media:check -- --strict

      # ------------------------------------------- advisory, never blocks the gate
      # Every suite here is reported individually so one run yields the whole
      # known-failure list instead of stopping at the first error. The step exits
      # non-zero on purpose: it should be visible, just not blocking.
      - name: Browser suites (advisory, non-blocking)
        continue-on-error: true
        run: |
          set -uo pipefail
          suites="test:studio-browser test:alpha13-browser test:alpha14-browser test:beta2-browser test:rc1-browser test:rc3-browser test:v31-alpha14-browser test:v31-alpha15-browser test:v31-alpha17-browser test:v31-alpha18-browser test:v31-alpha24-browser test:v31-alpha25-browser"
          passed=0; failed=0; failing=""
          for suite in $suites; do
            log="$(mktemp)"
            if npm run --silent "$suite" >"$log" 2>&1; then
              echo "PASS  $suite"
              passed=$((passed + 1))
            else
              echo "FAIL  $suite"
              failed=$((failed + 1))
              failing="$failing $suite"
              echo "::group::$suite failure"
              grep -E '^Error:|^AssertionError|^TypeError|Error:' "$log" | head -5 || tail -10 "$log"
              echo "::endgroup::"
            fi
            rm -f "$log"
          done
          echo
          echo "advisory browser suites: $((passed + failed)) run, $passed passed, $failed failed"
          if [ "$failed" -gt 0 ]; then
            echo "still failing:$failing"
            echo "These are advisory and do not block the merge; see the job summary."
          fi
          [ "$failed" -eq 0 ]

      # -------------------------------------------------------------- always runs
      - name: Generate production audit
        if: always()
        run: npm run audit:v3
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-release-audit
          path: reports/
          if-no-files-found: ignore
      - name: Upload browser regression
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-browser-regression
          path: .tmp-v3-browser-*/
          if-no-files-found: ignore
      - name: Upload studio browser regression
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-studio-browser-regression
          path: .tmp-v3-studio-browser/
          if-no-files-found: ignore
      - name: Upload Alpha13 import browser regression
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-alpha13-import-browser-regression
          path: .tmp-v3-alpha13-browser/
          if-no-files-found: ignore
      - name: Upload Alpha14 live Reader regression
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-alpha14-live-reader-regression
          path: .tmp-v3-alpha14-browser/
          if-no-files-found: ignore
      - name: Upload Beta1 block matrix regression
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-beta1-block-matrix-regression
          path: .tmp-v3-browser-preview-beta1-matrix/
          if-no-files-found: ignore
      - name: Upload Beta2 production rehearsal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-beta2-production-rehearsal
          path: reports/v3-beta2-production-rehearsal.json
          if-no-files-found: ignore
      - name: Upload Beta2 Safari-like compatibility regression
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-beta2-compatibility-regression
          path: .tmp-v3-browser-002-compat/
          if-no-files-found: ignore
      - name: Upload RC acceptance console regression
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-rc-acceptance-console-regression
          path: .tmp-v3-rc1-acceptance-browser/
          if-no-files-found: ignore
      - name: Upload RC1 deployment rehearsal and media baseline reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-rc1-release-candidate-reports
          path: |
            reports/v3-rc1-*.json
            reports/v3-full-media-check.json
          if-no-files-found: ignore
      - name: Upload RC2 gate closure reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-rc2-gate-closure-reports
          path: |
            reports/v3-rc2-*.json
            reports/v3-rc2-*.md
          if-no-files-found: ignore
      - name: Upload RC3 workspace and fast-track regression
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-rc3-workspace-fast-track-regression
          path: .tmp-v3-rc3-browser/
          if-no-files-found: ignore
      - name: Upload RC3 readiness reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-rc3-readiness-reports
          path: |
            reports/v3-rc3-*.json
            reports/v3-rc3-*.md
          if-no-files-found: ignore
      - name: Upload V3.1 Alpha2 style regression
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v31-alpha2-style-regression
          path: .tmp-v3-browser-preview-v31-style-matrix/
          if-no-files-found: ignore
      - name: Upload V3.1 Alpha1 layout regression
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v31-alpha1-layout-regression
          path: .tmp-v3-browser-preview-v31-layout-matrix/
          if-no-files-found: ignore
      - name: Generate V3.0.0 final readiness
        if: always()
        run: npm run final:status
      - name: Upload V3.0.0 final readiness
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-final-readiness
          path: |
            reports/v3-final-readiness.json
            reports/v3-final-readiness.md
          if-no-files-found: ignore
