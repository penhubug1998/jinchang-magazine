name: P1-22 temporary mainline merge helper

on:
  push:
    branches:
      - work/p1-22-merge-helper

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/p1-22-mainline-reconciliation
          fetch-depth: 0
      - name: Migrate Alpha3 final gate hash lock
        env:
          EXPECTED_HEAD: 383fbc9da88e85e608a6cac7f173dadb7ca77088
        run: |
          set -euo pipefail
          git config user.name "p1-22 merge helper"
          git config user.email "p1-22-merge-helper@users.noreply.github.com"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json

          def sha256(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          lock_path=Path('baselines/v3.0-final-gate-lock-alpha3.json')
          lock=json.loads(lock_path.read_text())
          files=lock.setdefault('files',{})
          files['scripts/final-release-v3.mjs']=sha256('scripts/final-release-v3.mjs')
          files['scripts/final-release-v30-v3.mjs']=sha256('scripts/final-release-v30-v3.mjs')
          lock['releaseBoundaryPolicy']='V3.1 generic final entrypoint fail-closed; V3.0 implementation preserved under versioned script'
          lock_path.write_text(json.dumps(lock,ensure_ascii=False,indent=2)+'\n')

          smoke_path=Path('scripts/v31-alpha3-smoke-v3.mjs')
          s=smoke_path.read_text()
          old="""for(const [file,expected] of Object.entries(lock.files||{})){\n  const actual=crypto.createHash('sha256').update(await readFile(file)).digest('hex');\n  if(actual!==expected)throw new Error(`V3.0 正式门禁关键文件被 Alpha3 改动：${file}`);\n}\nconst digest=crypto.createHash('sha256').update(JSON.stringify(schema)).digest('hex').slice(0,16);"""
          new="""for(const [file,expected] of Object.entries(lock.files||{})){\n  const actual=crypto.createHash('sha256').update(await readFile(file)).digest('hex');\n  if(actual!==expected)throw new Error(`Alpha3 发布边界关键文件发生漂移：${file}`);\n}\nif(lock.releaseBoundaryPolicy!=='V3.1 generic final entrypoint fail-closed; V3.0 implementation preserved under versioned script')throw new Error('Alpha3 发布边界策略声明异常');\nconst finalGuard=await readFile('scripts/final-release-v3.mjs','utf8');\nif(!finalGuard.includes('[P1-16]')||!finalGuard.includes('final:v31')||!finalGuard.includes('process.exit(64)'))throw new Error('Alpha3 未锁住 V3.1 通用 final 入口 fail-closed 行为');\nconst finalV30=await readFile('scripts/final-release-v30-v3.mjs','utf8');\nif(!finalV30.includes('FINAL_PACKAGE_READY_FOR_DEPLOY')||!finalV30.includes("status:'RELEASED'"))throw new Error('Alpha3 未锁住 V3.0 版本化两阶段发布实现');\nconst digest=crypto.createHash('sha256').update(JSON.stringify(schema)).digest('hex').slice(0,16);"""
          if old not in s:
              raise SystemExit('expected Alpha3 final gate lock loop not found')
          smoke_path.write_text(s.replace(old,new,1))
          PY
          git diff --check
          git add baselines/v3.0-final-gate-lock-alpha3.json scripts/v31-alpha3-smoke-v3.mjs
          git commit -m "test(p1-22): migrate Alpha3 final gate hash lock"
          git push origin HEAD:refs/heads/fix/p1-22-mainline-reconciliation
