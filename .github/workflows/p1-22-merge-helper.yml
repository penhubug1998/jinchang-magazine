name: P1-22 temporary mainline merge helper

on:
  push:
    branches:
      - work/p1-22-merge-helper

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/p1-22-mainline-reconciliation
          fetch-depth: 0
      - name: Migrate all V3.1 final gate hash locks
        env:
          EXPECTED_HEAD: 70e34d159c6fa6d63ebbf0a5e692f94899b3edc0
        run: |
          set -euo pipefail
          git config user.name "p1-22 merge helper"
          git config user.email "p1-22-merge-helper@users.noreply.github.com"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json

          def sha256(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          guard_sha=sha256('scripts/final-release-v3.mjs')
          legacy_sha=sha256('scripts/final-release-v30-v3.mjs')
          policy='V3.1 generic final entrypoint fail-closed; V3.0 implementation preserved under versioned script'
          changed=[]
          for lock_path in sorted(Path('baselines').glob('v3.0-final-gate-lock-alpha*.json')):
              lock=json.loads(lock_path.read_text())
              files=lock.setdefault('files',{})
              files['scripts/final-release-v3.mjs']=guard_sha
              files['scripts/final-release-v30-v3.mjs']=legacy_sha
              lock['releaseBoundaryPolicy']=policy
              lock_path.write_text(json.dumps(lock,ensure_ascii=False,indent=2)+'\n')
              changed.append(str(lock_path))
          if len(changed) < 20:
              raise SystemExit(f'expected >=20 Alpha final gate locks, found {len(changed)}')
          print(f'migrated {len(changed)} locks; guard={guard_sha}; v30={legacy_sha}')
          PY
          git diff --check
          git add baselines/v3.0-final-gate-lock-alpha*.json
          git commit -m "test(p1-22): migrate all Alpha final gate locks"
          git push origin HEAD:refs/heads/fix/p1-22-mainline-reconciliation
