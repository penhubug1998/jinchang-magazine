name: P1-22 temporary mainline merge helper

on:
  push:
    branches:
      - work/p1-22-merge-helper

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/p1-22-mainline-reconciliation
          fetch-depth: 0
      - name: Restore real images in Print PDF
        env:
          EXPECTED_HEAD: 735417a33c8b31f4e9f26948344ce0f84a8ad4fd
        run: |
          set -euo pipefail
          git config user.name "p1-22 merge helper"
          git config user.email "p1-22-merge-helper@users.noreply.github.com"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/studio-v3.mjs')
          s=p.read_text()
          old="else if(t==='image')body=`<figure><div class=\"media-placeholder\">图片</div>${b.caption?`<figcaption>${printEsc(pub.captionLabel?`${pub.captionLabel} ${b.caption}`:b.caption)}</figcaption>`:''}</figure>`;"
          new="else if(t==='image'){const src=printImages.get(stripAssetsPrefix(b.src||''));if(!src)throw publicationFailure('PDF_IMAGE_UNAVAILABLE','页面图片未绑定本地资源',['请在素材库选择图片后重试。']);body=`<figure><img class=\"print-image\" src=\"${src}\" alt=\"${printEsc(b.alt||'')}\">${b.caption?`<figcaption>${printEsc(pub.captionLabel?`${pub.captionLabel} ${b.caption}`:b.caption)}</figcaption>`:''}</figure>`;}"
          if old not in s: raise SystemExit('expected Print PDF image placeholder renderer not found')
          p.write_text(s.replace(old,new,1))
          PY
          git diff --check
          git add scripts/studio-v3.mjs
          git commit -m "fix(p1-22): render real images in Print PDF"
          git push origin HEAD:refs/heads/fix/p1-22-mainline-reconciliation
