name: P1-22 temporary mainline merge helper

on:
  push:
    branches:
      - work/p1-22-merge-helper

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/p1-22-mainline-reconciliation
          fetch-depth: 0
      - name: Verify embedded images in generated PDF
        env:
          EXPECTED_HEAD: 193b10725c1ae39785dcec9545876c9b6bbc5e33
        run: |
          set -euo pipefail
          git config user.name "p1-22 merge helper"
          git config user.email "p1-22-merge-helper@users.noreply.github.com"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/p1-08-production-e2e-v3.mjs')
          s=p.read_text()
          old="const pdf=await api(`/api/issues/${id}/publication/pdf`,{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});const pdfFile=path.join(sandbox,pdf.output.path),pdfBytes=await readFile(pdfFile);assert(pdfBytes.subarray(0,5).toString()==='%PDF-','invalid PDF header');report.artifacts.pdf={path:pdf.output.path,bytes:pdfBytes.length,sha256:sha(pdfBytes)};mark('PDF 导出',{note:`${Math.round(pdfBytes.length/1024)} KB`});"
          new="const pdf=await api(`/api/issues/${id}/publication/pdf`,{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});const pdfFile=path.join(sandbox,pdf.output.path),pdfBytes=await readFile(pdfFile);assert(pdfBytes.subarray(0,5).toString()==='%PDF-','invalid PDF header');assert(pdfBytes.includes(Buffer.from('/Subtype /Image')),'Print PDF missing embedded image object');report.artifacts.pdf={path:pdf.output.path,bytes:pdfBytes.length,sha256:sha(pdfBytes),embeddedImage:true};mark('PDF 导出',{note:`${Math.round(pdfBytes.length/1024)} KB · embedded image`});"
          if old not in s: raise SystemExit('expected P1-08 PDF assertion line not found')
          p.write_text(s.replace(old,new,1))
          PY
          git diff --check
          git add scripts/p1-08-production-e2e-v3.mjs
          git commit -m "test(p1-22): verify embedded images in Print PDF"
          git push origin HEAD:refs/heads/fix/p1-22-mainline-reconciliation
