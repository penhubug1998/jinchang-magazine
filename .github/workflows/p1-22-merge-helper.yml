name: P1-22 temporary mainline merge helper

on:
  push:
    branches:
      - work/p1-22-merge-helper

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/p1-22-mainline-reconciliation
          fetch-depth: 0
      - name: Reconcile strict audit table support
        env:
          EXPECTED_HEAD: 038eeffcc59c5982015d688b6d6747ce22e5b1af
        run: |
          set -euo pipefail
          git config user.name "p1-22 merge helper"
          git config user.email "p1-22-merge-helper@users.noreply.github.com"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/audit-v3.mjs')
          s=p.read_text()
          old="const knownBlocks=new Set(['paragraph','heading','quote','chips','cardline','casePair','toc','articleLink','video','image','coverMeta','coverSections','blessing','producer','cards','container','textFlow','pullQuote','sidebar','sectionHeading']);"
          new="const knownBlocks=new Set(['paragraph','heading','quote','chips','cardline','casePair','toc','articleLink','video','image','table','coverMeta','coverSections','blessing','producer','cards','container','textFlow','pullQuote','sidebar','sectionHeading']);"
          if old not in s: raise SystemExit('expected audit knownBlocks line not found')
          p.write_text(s.replace(old,new,1))
          PY
          git diff --check
          git add scripts/audit-v3.mjs
          git commit -m "fix(p1-22): allow imported tables in strict audit"
          git push origin HEAD:refs/heads/fix/p1-22-mainline-reconciliation
