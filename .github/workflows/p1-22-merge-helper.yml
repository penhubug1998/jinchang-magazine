name: P1-22 temporary mainline merge helper

on:
  push:
    branches:
      - work/p1-22-merge-helper

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/p1-22-mainline-reconciliation
          fetch-depth: 0
      - name: Fix P1-08 double-column overflow fixture
        env:
          EXPECTED_HEAD: 870440c926254fbf5076cbb6b0fea746116e084b
        run: |
          set -euo pipefail
          git config user.name "p1-22 merge helper"
          git config user.email "p1-22-merge-helper@users.noreply.github.com"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/p1-08-production-e2e-v3.mjs')
          s=p.read_text()
          old="const pageWithImage=issue.pages.find(p=>collectBlocks([p],'image').length);const imageBlocks=(pageWithImage.blocks||[]).filter(b=>b.type==='image'),textBlocks=(pageWithImage.blocks||[]).filter(b=>b.type!=='image');pageWithImage.publishing={...(pageWithImage.publishing||{}),columns:2,columnGap:24,balanceColumns:true};pageWithImage.blocks=[{type:'container',layout:'media-right',mobile:'stack',columns:[{blocks:textBlocks},{blocks:imageBlocks}]}];mark('调整布局',{note:'media-right · 双栏 · mobile stack'});"
          new="const pageWithImage=issue.pages.find(p=>collectBlocks([p],'image').length);const imageBlocks=(pageWithImage.blocks||[]).filter(b=>b.type==='image'),textBlocks=(pageWithImage.blocks||[]).filter(b=>b.type!=='image');pageWithImage.publishing={...(pageWithImage.publishing||{}),columns:1,columnGap:24,balanceColumns:false};pageWithImage.blocks=[{type:'container',layout:'media-right',mobile:'stack',columns:[{blocks:textBlocks},{blocks:imageBlocks}]}];mark('调整布局',{note:'media-right · 容器双栏 · mobile stack'});"
          if old not in s: raise SystemExit('expected P1-08 layout line not found')
          p.write_text(s.replace(old,new,1))
          PY
          git diff --check
          git add scripts/p1-08-production-e2e-v3.mjs
          git commit -m "fix(p1-22): keep P1-08 PDF fixture within A4"
          git push origin HEAD:refs/heads/fix/p1-22-mainline-reconciliation
