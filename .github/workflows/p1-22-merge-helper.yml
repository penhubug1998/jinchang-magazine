name: P1-22 temporary mainline merge helper

on:
  push:
    branches:
      - work/p1-22-merge-helper

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/p1-22-mainline-reconciliation
          fetch-depth: 0
      - name: Adapt P1-08 media-right fixture to rich reflow
        env:
          EXPECTED_HEAD: 2b14f0fd20a464665801acfc3317cd0497225c86
        run: |
          set -euo pipefail
          git config user.name "p1-22 merge helper"
          git config user.email "p1-22-merge-helper@users.noreply.github.com"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/p1-08-production-e2e-v3.mjs')
          s=p.read_text()
          old="const pageWithImage=issue.pages.find(p=>collectBlocks([p],'image').length);const pageBlocks=pageWithImage.blocks||[],imageIndex=pageBlocks.findIndex(b=>b.type==='image'),textIndex=pageBlocks.findIndex((b,i)=>i!==imageIndex&&b.type==='paragraph');assert(imageIndex>=0&&textIndex>=0,'没有可用于 media-right 的图文对');const pairedImage=pageBlocks[imageIndex],pairedText=pageBlocks[textIndex],insertAt=Math.min(imageIndex,textIndex),rest=pageBlocks.filter((_,i)=>i!==imageIndex&&i!==textIndex);rest.splice(insertAt,0,{type:'container',layout:'media-right',mobile:'stack',columns:[{blocks:[pairedText]},{blocks:[pairedImage]}]});pageWithImage.publishing={...(pageWithImage.publishing||{}),columns:1,columnGap:24,balanceColumns:false};pageWithImage.blocks=rest;mark('调整布局',{note:'media-right · 单组图文双栏 · mobile stack'});"
          new="const pageWithImage=issue.pages.find(p=>collectBlocks([p],'image').length);const pageBlocks=pageWithImage.blocks||[],imageIndex=pageBlocks.findIndex(b=>b.type==='image');assert(imageIndex>=0,'没有可用于 media-right 的图片');const pairedImage=pageBlocks[imageIndex],pairedText={type:'paragraph',style:'body',text:'图片说明：本段用于验证富 Word 分页后的 media-right 图文双栏编辑。'},rest=pageBlocks.filter((_,i)=>i!==imageIndex);rest.splice(imageIndex,0,{type:'container',layout:'media-right',mobile:'stack',columns:[{blocks:[pairedText]},{blocks:[pairedImage]}]});pageWithImage.publishing={...(pageWithImage.publishing||{}),columns:1,columnGap:24,balanceColumns:false};pageWithImage.blocks=rest;mark('调整布局',{note:'media-right · 图片说明+图片双栏 · mobile stack'});"
          if old not in s: raise SystemExit('expected P1-08 media-right fixture not found')
          p.write_text(s.replace(old,new,1))
          PY
          git diff --check
          git add scripts/p1-08-production-e2e-v3.mjs
          git commit -m "test(p1-22): adapt media-right edit after rich reflow"
          git push origin HEAD:refs/heads/fix/p1-22-mainline-reconciliation
