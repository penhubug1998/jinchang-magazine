name: V31 Alpha15 fixture repair

on:
  push:
    branches: [fix/ci-tts-baseline-20260906]
    paths: [.github/workflows/v31-alpha15-fixture-repair.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    env:
      CHROMIUM: ${{ github.workspace }}/scripts/chrome-ci-wrapper.sh
      V3_REAL_CHROME: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ci-tts-baseline-20260906
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Patch Alpha15 current contracts
        run: |
          node <<'NODE'
          const fs=require('fs');
          const file='scripts/v31-alpha15-browser-v3.mjs';
          let src=fs.readFileSync(file,'utf8');
          src=src.replace(/ const health=await waitJson\(`http:\/\/127\.0\.0\.1:\$\{port\}\/api\/health`\);assert\(\[[^;]+?\.includes\(health\.version\),`health \$\{JSON\.stringify\(health\)\}`\);/," const expectedVersion=JSON.parse(await readFile('package.json','utf8')).version;const health=await waitJson(`http://127.0.0.1:${port}/api/health`);assert(health.version===expectedVersion,`health ${JSON.stringify(health)} expected ${expectedVersion}`);");
          const loadOld=" const [html,css,studioJs,presetJs,readerHtml,readerCss,readerJs]=await Promise.all([readFile('src/studio/index.html','utf8'),readFile('src/studio/studio.css','utf8'),readFile('src/studio/studio.js','utf8'),readFile('src/studio/design-presets.js','utf8'),readFile('src/reader/index.html','utf8'),readFile('src/reader/reader.css','utf8'),readFile('src/reader/reader.js','utf8')]);";
          const loadNew=" const [html,css,studioJs,presetJs,readerHtml,readerCss,readerJs,richTextJs,layoutEngineJs]=await Promise.all([readFile('src/studio/index.html','utf8'),readFile('src/studio/studio.css','utf8'),readFile('src/studio/studio.js','utf8'),readFile('src/studio/design-presets.js','utf8'),readFile('src/reader/index.html','utf8'),readFile('src/reader/reader.css','utf8'),readFile('src/reader/reader.js','utf8'),readFile('src/reader/rich-text.js','utf8'),readFile('src/reader/layout-engine.js','utf8')]);";
          if(!src.includes(loadOld))throw new Error('Alpha15 dependency load drift');src=src.replace(loadOld,loadNew);
          const moduleRe=/ const presetInline=presetJs\.replace\([\s\S]*?const safe=JSON\.stringify\(issue\)\.replaceAll\('<','\\\\u003c'\);/;
          if(!moduleRe.test(src))throw new Error('Alpha15 Studio module drift');
          src=src.replace(moduleRe," const presetUrl='data:text/javascript;base64,'+Buffer.from(presetJs,'utf8').toString('base64');const studioInline=studioJs.replace(/from\\s*['\"]\\.\\/design-presets\\.js(?:\\?[^'\"]*)?['\"]/,`from '${presetUrl}'`);if(/from\\s*['\"]\\.\\/design-presets\\.js/.test(studioInline))throw new Error('Alpha15 Studio module rewrite failed');const safe=JSON.stringify(issue).replaceAll('<','\\\\u003c');");
          src=src.replace(/html\.replace\('<link rel="stylesheet" href="\.\/studio\.css">',`<style>\$\{css\}<\/style>`\)\.replace\('<script type="module" src="\.\/studio\.js"><\/script>',/g,"html.replace(/<link rel=\"stylesheet\" href=\"\\.\\/studio\\.css(?:\\?[^\"]*)?\">/,`<style>${css}</style>`).replace(/<script type=\"module\" src=\"\\.\\/studio\\.js(?:\\?[^\"]*)?\"><\\/script>/,");
          const readerStart=' const readerBoot=`<script>window.__V3_STUDIO_EMBED__=true;';
          if(src.includes(readerStart)){
            src=src.replace(readerStart," const richUrl='data:text/javascript;base64,'+Buffer.from(richTextJs,'utf8').toString('base64');const layoutModule=layoutEngineJs.replace(/from\\s*['\"]\\.\\/rich-text\\.js(?:\\?[^'\"]*)?['\"]/,`from '${richUrl}'`);const layoutUrl='data:text/javascript;base64,'+Buffer.from(layoutModule,'utf8').toString('base64');const readerModule=readerJs.replace(/from\\s*['\"]\\.\\/rich-text\\.js(?:\\?[^'\"]*)?['\"]/,`from '${richUrl}'`).replace(/from\\s*['\"]\\.\\/layout-engine\\.js(?:\\?[^'\"]*)?['\"]/,`from '${layoutUrl}'`);const readerBoot=`<script>window.__V3_STUDIO_EMBED__=true;");
            src=src.replace(/readerHtml\.replace\('<link rel="stylesheet" href="\.\/reader\.css">',`<style>\$\{readerCss\}<\/style>`\)\.replace\('<script type="module" src="\.\/reader\.js"><\/script>',`\$\{readerBoot\}<script>\$\{readerJs\}<\/script>`\)/g,"readerHtml.replace(/<link rel=\"stylesheet\" href=\"\\.\\/reader\\.css(?:\\?[^\"]*)?\">/,`<style>${readerCss}</style>`).replace(/<script type=\"module\" src=\"\\.\\/reader\\.js(?:\\?[^\"]*)?\"><\\/script>/,`${readerBoot}<script type=\"module\">${readerModule}</script>`)");
          }
          src=src.replace("button:document.getElementById('enterWorkspaceBtn')?.textContent","button:document.getElementById('managerWorkspaceEnter')?.textContent").replace("manager.button.includes('沉浸工作区')","manager.button.includes('进入工作区')");
          const begin=src.indexOf('const beginInline=await ev(`');
          const end=src.indexOf("shot=await cdp.send('Page.captureScreenshot'",begin);
          if(begin<0||end<0)throw new Error('Alpha15 inline-edit block drifted');
          const replacement=`const beginInline=await ev(\`(()=>{const f=document.getElementById('rf'),w=f.contentWindow,d=f.contentDocument,el=d.querySelector('.studio-design-target[data-design-block="0"] [data-studio-edit-field="text"]');el.dispatchEvent(new w.MouseEvent('dblclick',{bubbles:true,cancelable:true}));return true})()\`);for(let i=0;i<100;i++){if(await ev(\`document.getElementById('rf').contentWindow.__V3_RICH_TEXT_ENGINE__?.active===true\`).catch(()=>false))break;await sleep(20)}const richBegin=await ev(\`(()=>{const f=document.getElementById('rf'),d=f.contentDocument,el=d.querySelector('.studio-design-target[data-design-block="0"] [data-studio-edit-field="text"]'),edit=el.querySelector('[contenteditable="true"]')||el;return {active:f.contentWindow.__V3_RICH_TEXT_ENGINE__?.active===true,runtime:el.dataset.richRuntime||'',editable:edit.getAttribute('contenteditable'),toolbar:d.getElementById('studioTextToolbar').hidden}})()\`);assert(richBegin.active&&!richBegin.toolbar,\`rich inline begin \${JSON.stringify(richBegin)}\`);await ev(\`(()=>{const f=document.getElementById('rf'),w=f.contentWindow,d=f.contentDocument,el=d.querySelector('.studio-design-target[data-design-block="0"] [data-studio-edit-field="text"]'),edit=el.querySelector('[contenteditable="true"]')||el;edit.focus();const sel=w.getSelection(),r=d.createRange();r.selectNodeContents(edit);sel.removeAllRanges();sel.addRange(r);d.execCommand('insertText',false,'Reader 里直接编辑完成。');edit.dispatchEvent(new w.InputEvent('input',{bubbles:true,inputType:'insertText',data:'Reader 里直接编辑完成。'}));})()\`);for(let i=0;i<80;i++){if(await ev(\`window.__CAPTURED__.some(x=>x.type==='canvas-richtext-edit'&&JSON.stringify(x.richText||{}).includes('Reader 里直接编辑完成'))\`))break;await sleep(20)}await ev(\`document.getElementById('rf').contentDocument.querySelector('#studioTextToolbar [data-rich-command="bold"]').click()\`);await sleep(60);await ev(\`(()=>{const d=document.getElementById('rf').contentDocument,el=d.querySelector('.studio-design-target[data-design-block="0"] [data-studio-edit-field="text"]'),edit=el.querySelector('[contenteditable="true"]')||el;edit.blur()})()\`);for(let i=0;i<80;i++){if(await ev(\`window.__CAPTURED__.filter(x=>x.type==='canvas-richtext-edit').some(x=>x.final===true)\`))break;await sleep(20)}const inline=await ev(\`(()=>{const d=document.getElementById('rf').contentDocument,msgs=window.__CAPTURED__.filter(x=>x.type==='canvas-richtext-edit'),json=JSON.stringify(msgs);return {messages:msgs.length,hasText:json.includes('Reader 里直接编辑完成'),hasBold:json.includes('bold'),toolbarHidden:d.getElementById('studioTextToolbar').hidden,content:d.querySelector('.studio-design-target[data-design-block="0"] [data-studio-edit-field="text"]')?.textContent}})()\`);assert(inline.messages>0&&inline.hasText&&inline.hasBold,\`rich inline \${JSON.stringify(inline)}\`);`;
          src=src.slice(0,begin)+replacement+src.slice(end);
          fs.writeFileSync(file,src);
          NODE
          git diff --check
      - name: Verify Alpha15
        run: |
          chmod +x scripts/chrome-ci-wrapper.sh
          node scripts/v31-alpha15-smoke-v3.mjs
          node scripts/v31-alpha15-browser-v3.mjs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v31-alpha15-fixture-repair.yml
          git add scripts/v31-alpha15-browser-v3.mjs
          git commit -m "test(v31): align Alpha15 browser fixture with current rich text"
          git push origin HEAD:fix/ci-tts-baseline-20260906
