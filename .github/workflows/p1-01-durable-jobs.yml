name: P1-01 durable background jobs

on:
  push:
    branches:
      - fix/ci-tts-baseline-20260906
    paths:
      - .github/workflows/p1-01-durable-jobs.yml
      - scripts/p1-01-durable-jobs-patch.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ci-tts-baseline-20260906
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply durable job table patch
        run: |
          python3 scripts/p1-01-durable-jobs-patch.py
          node --check scripts/studio-v3.mjs
          git diff --check
      - name: Write restart and retry smoke
        run: |
          cat > scripts/p1-01-background-jobs-smoke-v3.mjs <<'EOF'
          import {spawn} from 'node:child_process';
          import {mkdtemp,writeFile,readFile,rm} from 'node:fs/promises';
          import os from 'node:os';
          import path from 'node:path';
          import net from 'node:net';
          const root=process.cwd(),assert=(c,m)=>{if(!c)throw new Error(m)},sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function freePort(){return await new Promise((ok,bad)=>{const s=net.createServer();s.listen(0,'127.0.0.1',()=>{const p=s.address().port;s.close(()=>ok(p))});s.on('error',bad)})}
          const tmp=await mkdtemp(path.join(os.tmpdir(),'v3jobs-')),file=path.join(tmp,'jobs.json'),port=await freePort(),id='job-interrupted-smoke';
          await writeFile(file,JSON.stringify({version:1,jobs:[{id,kind:'build',issueId:'001',payload:{},sourceFingerprint:null,status:'running',progress:{stage:'构建',percent:25},createdAt:new Date().toISOString(),startedAt:new Date().toISOString()}]},null,2));
          const child=spawn(process.execPath,['scripts/studio-v3.mjs','--host','127.0.0.1','--port',String(port)],{cwd:root,env:{...process.env,NODE_ENV:'test',STUDIO_AUTH_MODE:'off',STUDIO_AUTH_ALLOW_OFF:'1',V3_BACKGROUND_JOB_FILE:file},stdio:'ignore'});
          try{
            let ready=false;
            for(let i=0;i<120;i++){try{if((await fetch(`http://127.0.0.1:${port}/api/health`)).ok){ready=true;break}}catch{}await sleep(100)}
            assert(ready,'server not ready');
            const old=await (await fetch(`http://127.0.0.1:${port}/api/jobs/${id}`)).json();
            assert(old.status==='interrupted'&&old.retryable&&old.errorDetails?.code==='SERVICE_RESTART','restart did not persist explicit interrupted state');
            const retry=await fetch(`http://127.0.0.1:${port}/api/jobs/${id}/retry`,{method:'POST'});
            assert(retry.status===202,'interrupted job retry endpoint failed');
            const queued=await retry.json();
            assert(queued.jobId&&queued.jobId!==id,'retry did not create a new traceable job');
            const persisted=JSON.parse(await readFile(file,'utf8'));
            assert(persisted.jobs.some(x=>x.id===id&&x.status==='interrupted'),'interrupted state not durable');
            console.log('P1-01 PASS: persistent job table, explicit restart interruption and retry endpoint are working.');
          }finally{child.kill('SIGTERM');await rm(tmp,{recursive:true,force:true})}
          EOF
          node scripts/p1-01-background-jobs-smoke-v3.mjs
      - name: Commit verified P1-01 implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/p1-01-durable-jobs.yml scripts/p1-01-durable-jobs-patch.py
          git add .gitignore scripts/studio-v3.mjs scripts/p1-01-background-jobs-smoke-v3.mjs
          git commit -m "feat(p1-01): persist interrupt cancel and retry background jobs"
          git push origin HEAD:fix/ci-tts-baseline-20260906
