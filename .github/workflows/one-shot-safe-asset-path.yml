name: One-shot safe asset path patch
on:
  push:
    branches: [fix/ci-tts-baseline-20260906]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ci-tts-baseline-20260906
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact source patch
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const file='scripts/studio-v3.mjs';
          const source=fs.readFileSync(file,'utf8');
          const old=`function safeAssetRelative(input='') {
            const rel=stripAssetsPrefix(String(input||'')).replaceAll('\\\\','/').replace(/^\\/+/, '');
            if(!rel||rel.includes('..')||path.isAbsolute(rel))throw new Error('媒体路径不合法');
            return rel;
          }`;
          const replacement=`function safeAssetRelative(input='') {
            const source=String(input||'').trim().replaceAll('\\\\','/');
            if(!source||source.startsWith('/')||/^[a-zA-Z]:\\//.test(source))throw new Error('媒体路径不合法');
            const rel=stripAssetsPrefix(source);
            const segments=rel.split('/');
            if(!rel||segments.some(segment=>!segment||segment==='.'||segment==='..')||path.isAbsolute(rel))throw new Error('媒体路径不合法');
            return rel;
          }`;
          const count=source.split(old).length-1;
          if(count!==1)throw new Error(`safeAssetRelative exact source contract drifted: matches=${count}`);
          fs.writeFileSync(file,source.replace(old,replacement));
          NODE
          git diff --check
          git diff -- scripts/studio-v3.mjs
      - name: Verify path safety regression
        run: node scripts/media-path-safety-smoke-v3.mjs
      - name: Commit exact patch and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-shot-safe-asset-path.yml
          git add scripts/studio-v3.mjs
          test "$(git diff --cached --name-only | sort)" = $'.github/workflows/one-shot-safe-asset-path.yml\nscripts/studio-v3.mjs'
          git commit -m 'fix(media): allow legal double-dot filenames safely'
          git push origin HEAD:fix/ci-tts-baseline-20260906
