name: P1-12 finalization bypass closure

on:
  push:
    branches:
      - feat/p1-12-finalization-bypass-closure
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: p1-12-finalization-bypass-closure
  cancel-in-progress: false

jobs:
  finalization:
    runs-on: ubuntu-24.04
    env:
      CHROMIUM: ${{ github.workspace }}/scripts/chrome-ci-wrapper.sh
      V3_REAL_CHROME: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p1-12-finalization-bypass-closure
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Integrate final npm entrypoints and close bypass
        run: |
          if node -e "const p=require('./package.json');process.exit(p.scripts?.['test:p1-12']?0:1)"; then
            echo 'P1-12 package integration already present'
          else
            python3 scripts/p1-12-finalization-patch.py
          fi
          chmod +x scripts/chrome-ci-wrapper.sh
          node --check scripts/lib-p1-12-finalization-v3.mjs
          node --check scripts/p1-12-finalization-gate-v3.mjs
          node --check scripts/p1-12-finalize-v3.mjs
          node --check scripts/p1-12-finalization-smoke-v3.mjs
          node --check scripts/v31-finalize-v3.mjs
          git diff --check

      - name: Commit package routing locally before acceptance
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          if git diff --cached --quiet; then
            echo 'P1-12 package routing already committed'
          else
            git commit -m "fix(p1-12): route final entrypoints through sealed evidence"
          fi
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: P1-12 static and immutable contract smoke
        run: |
          npm run test:p1-12
          npm run test:p1-11
          npm run test:p1-10

      - name: Start session and re-run current-source E2E
        run: |
          npm run final:v31:session:start -- --issue 004 --reset
          npm run test:p1-08
          npm run final:v31:acceptance:status
          npm run final:v31:session:status
          node <<'NODE'
          const fs=require('fs');const {execFileSync}=require('child_process');
          const head=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          const session=JSON.parse(fs.readFileSync('reports/p1-11-final-acceptance-session.json','utf8'));
          const acceptance=JSON.parse(fs.readFileSync('reports/p1-10-final-acceptance.json','utf8'));
          if(session.source?.commit!==head||session.status!=='ACTIVE')throw new Error('P1-12 session is not bound to current HEAD');
          if(acceptance.status!=='HOLD'||acceptance.ready!==2||acceptance.total!==8)throw new Error(`expected HOLD 2/8, got ${acceptance.status} ${acceptance.ready}/${acceptance.total}`);
          NODE

      - name: Prove every finalization entrypoint fails closed below 8/8
        run: |
          npm run final:v31:finalization:status
          if npm run final:v31:gate; then echo 'final:v31:gate bypassed sealed evidence' >&2; exit 1; fi
          if npm run final:v31:package-guard; then echo 'package guard bypassed sealed evidence' >&2; exit 1; fi
          if npm run final:v31 -- --confirm; then echo 'new final:v31 bypassed sealed evidence' >&2; exit 1; fi
          if node scripts/v31-finalize-v3.mjs --confirm; then echo 'legacy v31-finalize bypassed P1-12' >&2; exit 1; fi
          if npm run final:v31:session:seal; then echo 'session sealed below 8/8' >&2; exit 1; fi
          node <<'NODE'
          const fs=require('fs');const r=JSON.parse(fs.readFileSync('reports/p1-12-finalization-gate.json','utf8'));
          if(r.status!=='BLOCKED'||r.ready!==false)throw new Error('P1-12 gate should be BLOCKED in CI');
          if(!r.failed.includes('sessionSealed')||!r.failed.includes('strictBundle')||!r.failed.includes('acceptance'))throw new Error(`missing fail-closed reasons: ${r.failed}`);
          NODE

      - name: Partial bundle remains reviewable but not finalizable
        run: |
          npm run final:v31:evidence:bundle
          npm run final:v31:evidence:verify
          if npm run final:v31:evidence:bundle:strict; then echo 'strict bundle unexpectedly passed' >&2; exit 1; fi
          if npm run final:v31:gate; then echo 'gate unexpectedly passed after partial bundle' >&2; exit 1; fi

      - name: Preserve production and Studio contracts
        run: |
          npm run test:p1-09
          npm run test:p1-07
          node scripts/studio-v3.mjs --check
          npm run check:v3
          npm run build:v3
          test -z "$(git status --porcelain --untracked-files=no)"
          git diff --check

      - name: Push sealed P1-12 source
        run: |
          git push origin HEAD:feat/p1-12-finalization-bypass-closure
