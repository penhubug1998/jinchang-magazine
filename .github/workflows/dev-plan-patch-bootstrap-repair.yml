name: Dev plan patch bootstrap repair
on:
  push:
    branches: [fix/ci-tts-baseline-20260906]
    paths: [.github/workflows/dev-plan-patch-bootstrap-repair.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair-and-run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ci-tts-baseline-20260906
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repair bootstrap script and normalize route contract
        run: |
          node <<'NODE'
          const fs=require('fs');
          {
            const file='scripts/dev-plan-current-patch.cjs';
            let src=fs.readFileSync(file,'utf8');
            const replacements=[
              ["  assert(statuses[0]===200&&statuses[1]===409,`parallel save should serialize to one success and one conflict: ${JSON.stringify(statuses)}`);\\n","  assert(statuses[0]===200&&statuses[1]===409,'parallel save should serialize to one success and one conflict: '+JSON.stringify(statuses));\\n"],
              ["assert(code!==0&&out.includes('STUDIO_ADMIN_PASSWORD'),`formal direct server must refuse unauthenticated boot: ${'${'}code} ${'${'}out}`);\\n","assert(code!==0&&out.includes('STUDIO_ADMIN_PASSWORD'),'formal direct server must refuse unauthenticated boot: '+code+' '+out);\\n"]
            ];
            for(const [oldText,newText] of replacements){if(!src.includes(oldText))throw new Error('bootstrap nested template contract drifted');src=src.replace(oldText,newText);}
            fs.writeFileSync(file,src);
          }
          {
            const file='scripts/studio-v3.mjs';
            let src=fs.readFileSync(file,'utf8');
            const start=src.indexOf("    if (seg.length===3&&req.method==='PUT') {");
            const end=src.indexOf("\n    if (seg[3]==='review-workspace'",start);
            if(start<0||end<0)throw new Error('issue PUT route boundaries not found');
            const normalized="    if (seg.length===3&&req.method==='PUT') { const payload=await body(req);const data=payload?.issue&&typeof payload.issue==='object'&&!Array.isArray(payload.issue)?payload.issue:payload;const expectedFingerprint=String(payload?.sourceFingerprint||'');const currentFingerprint=issueSourceFingerprint(issue);if(expectedFingerprint&&expectedFingerprint!==currentFingerprint)return send(res,409,{error:'服务器制作源已更新；为避免覆盖新内容，本次保存已拒绝。请重新打开本期后再合并修改。',code:'SOURCE_DRIFT',source:await readSourceStatus(id,issue)});try{validateIssue(data,id)}catch(e){return send(res,400,{error:e.message||String(e),code:'VALIDATION_ERROR'})}if(issue.status==='published'&&data.status==='published'){data.revision={...(data.revision||{}),pending:true,updatedAt:new Date().toISOString(),basePublishedAt:issue.publishedAt||null,source:'studio'};}const snap=await snapshotIssue(id,'studio-before-save');await writeFile(issueFile,`${JSON.stringify(data,null,2)}\\n`,'utf8');await deleteDraftFile(id);await runScriptAsync('sync-assets-v3.mjs',['--issue',id]);const source=await writeSourceReceipt(id,data,{reason:'studio-save',snapshot:snap});return send(res,200,{issue:data,snapshot:snap,source}); }";
            src=src.slice(0,start)+normalized+src.slice(end);
            fs.writeFileSync(file,src);
          }
          NODE
          node --check scripts/dev-plan-current-patch.cjs
          node --check scripts/studio-v3.mjs
          git diff --check
      - name: Bootstrap deterministic dependencies
        run: |
          if [ ! -f package-lock.json ]; then npm install --package-lock-only --ignore-scripts; fi
          npm ci
      - name: Execute development-plan patch
        run: |
          node scripts/dev-plan-current-patch.cjs
          node --check scripts/studio-v3.mjs
          node --check src/studio/studio.js
          node scripts/plan-p0-reliability-smoke-v3.mjs
          node scripts/source-guard-smoke-v3.mjs
      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/dev-plan-patch-bootstrap-repair.yml
          git add package-lock.json scripts/dev-plan-current-patch.cjs scripts/plan-p0-reliability-smoke-v3.mjs scripts/source-guard-smoke-v3.mjs scripts/studio-v3.mjs src/studio/studio.js .gitignore
          git commit -m "feat(plan): harden source saves and formal auth boundary"
          git push origin HEAD:fix/ci-tts-baseline-20260906
