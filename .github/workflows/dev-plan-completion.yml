name: Development plan completion
on:
  push:
    branches: [fix/ci-tts-baseline-20260906]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  implement-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CHROMIUM: ${{ github.workspace }}/scripts/chrome-ci-wrapper.sh
      V3_REAL_CHROME: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ci-tts-baseline-20260906
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Create dependency lock when bootstrapping this repository
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts
          fi
          test -f package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Apply current development-plan patch
        run: node scripts/dev-plan-current-patch.cjs
      - name: Build deterministic local Tiptap runtime
        run: npm run vendor:tiptap
      - name: Verify patch hygiene
        run: git diff --check
      - name: Verify P0 and rich-text delivery
        run: |
          chmod +x scripts/chrome-ci-wrapper.sh
          node scripts/import-boundary-smoke-v3.mjs
          node scripts/source-conflict-client-smoke-v3.mjs
          node scripts/source-guard-smoke-v3.mjs
          node scripts/admin-auth-smoke-v3.mjs
          node scripts/studio-formal-auth-smoke-v3.mjs
          node scripts/plan-p0-reliability-smoke-v3.mjs
          node scripts/v31-alpha22-smoke-v3.mjs
          node scripts/v31-alpha221-smoke-v3.mjs
          node -e "import('./src/reader/vendor/tiptap-runtime.js').then(m=>{if(!m.TIPTAP_VENDOR_READY||m.TIPTAP_VERSION!=='3.30.2'||!m.Editor)throw new Error('Tiptap vendor runtime not ready');console.log('Tiptap vendor runtime ready',m.TIPTAP_VERSION)})"
          node scripts/studio-v3.mjs --check
      - name: Remove superseded one-shot workflow
        run: git rm -f .github/workflows/plan-p0-reliability.yml 2>/dev/null || true
      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json src/studio/studio.js scripts/studio-v3.mjs scripts/source-guard-smoke-v3.mjs scripts/plan-p0-reliability-smoke-v3.mjs src/reader/vendor/tiptap-runtime.js src/reader/vendor/tiptap-runtime.manifest.json .github/workflows/plan-p0-reliability.yml
          if git diff --cached --quiet; then
            echo "No implementation changes to commit"
            exit 0
          fi
          git commit -m "fix(plan): close P0 reliability and Tiptap delivery gaps"
          git push origin HEAD:fix/ci-tts-baseline-20260906
