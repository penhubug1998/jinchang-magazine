name: P1-05 deterministic Tiptap vendor

on:
  push:
    branches:
      - fix/ci-tts-baseline-20260906
    paths:
      - .github/workflows/p1-05-tiptap-vendor.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ci-tts-baseline-20260906
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked dependencies
        run: npm ci
      - name: Build self-hosted Tiptap runtime
        run: |
          npm run vendor:tiptap
          node -e "import('./src/reader/vendor/tiptap-runtime.js').then(m=>{if(!m.TIPTAP_VENDOR_READY)process.exit(2);if(m.TIPTAP_VERSION!=='3.30.2')process.exit(3);if(!m.Editor||!m.StarterKit||!m.TextStyleKit||!m.Highlight||!m.TextAlign)process.exit(4);console.log('Tiptap vendor ready',m.TIPTAP_VERSION)})"
          test $(wc -c < src/reader/vendor/tiptap-runtime.js) -gt 100000
          git diff --check -- . ':(exclude)src/reader/vendor/tiptap-runtime.js'
      - name: Verify current rich-text contracts
        run: |
          npm run test:v31-alpha22
          npm run test:v31-alpha22-1
          npm run test:v31-alpha23
          node - <<'NODE'
          import {getRichTextRuntimeStatus,loadTiptapRuntime,legacyTextToRichText,richTextPlainText} from './src/reader/rich-text.js';
          const runtime=await loadTiptapRuntime();
          if(runtime.source!=='self-hosted')throw new Error('Tiptap must be self-hosted');
          if(getRichTextRuntimeStatus().mode!=='tiptap')throw new Error('real Tiptap runtime did not activate');
          if(richTextPlainText(legacyTextToRichText('确定性富文本'))!=='确定性富文本')throw new Error('rich-text model regression');
          console.log('P1-05 real runtime PASS');
          NODE
      - name: Commit locked vendor artifact
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/p1-05-tiptap-vendor.yml
          git add package-lock.json src/reader/vendor/tiptap-runtime.js
          git commit -m "feat(p1-05): lock self-hosted Tiptap runtime"
          git push origin HEAD:fix/ci-tts-baseline-20260906
