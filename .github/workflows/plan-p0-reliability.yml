name: Plan P0 reliability hardening
on:
  push:
    branches: [fix/ci-tts-baseline-20260906]
    paths: [.github/workflows/plan-p0-reliability.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch-test-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/ci-tts-baseline-20260906, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Apply P0 reliability fixes
        run: |
          node <<'NODE'
          const fs=require('fs');
          let studio=fs.readFileSync('src/studio/studio.js','utf8');
          studio=studio.replace("sourceStatus:null, sourceFingerprint:'', page: 0","sourceStatus:null, sourceFingerprint:'', sourceObservedFingerprint:'', sourceConflict:null, page: 0");
          const refreshOld=`async function refreshSourceStatus({quiet=false}={}){
  const id=state.issue?.id;if(!id)return null;
  try{const source=await api(\`/api/issues/\${encodeURIComponent(id)}/source-status\`);if(state.issue?.id!==id)return null;state.sourceStatus=source;state.sourceFingerprint=String(source?.fingerprint||'');renderSourceStatus();return source;}
  catch(error){if(!quiet)toast(\`读取服务器制作源失败：\${error.message}\`,3000);return null;}
}`;
          const refreshNew=`async function refreshSourceStatus({quiet=false,adoptBaseline=false}={}){
  const id=state.issue?.id;if(!id)return null;
  try{const source=await api(\`/api/issues/\${encodeURIComponent(id)}/source-status\`);if(state.issue?.id!==id)return null;state.sourceStatus=source;state.sourceObservedFingerprint=String(source?.fingerprint||'');if(adoptBaseline&&!state.dirty&&!state.sourceConflict)state.sourceFingerprint=state.sourceObservedFingerprint;renderSourceStatus();return source;}
  catch(error){if(!quiet)toast(\`读取服务器制作源失败：\${error.message}\`,3000);return null;}
}`;
          if(!studio.includes(refreshOld))throw new Error('refreshSourceStatus contract drifted');studio=studio.replace(refreshOld,refreshNew);
          studio=studio.replace("state.sourceStatus=sourceStatus; state.sourceFingerprint=String(sourceStatus?.fingerprint||''); state.identityMigrationPending","state.sourceStatus=sourceStatus; state.sourceFingerprint=String(sourceStatus?.fingerprint||''); state.sourceObservedFingerprint=state.sourceFingerprint; state.sourceConflict=null; state.identityMigrationPending");
          const saveOld=`async function saveIssue({ silent=false }={}) {
  if (!state.issue || !commitPage()) return false; syncMeta();
  const identityRepair = ensureIssueIdentity(state.issue);
  if (identityRepair.changed) { state.identityMigrationPending = true; syncJsonFromPage(); renderPages(); renderBlockList(); }
  try { const res = await api(\`/api/issues/\${state.issue.id}\`, { method:'PUT', body:JSON.stringify({issue:state.issue,sourceFingerprint:state.sourceFingerprint}) }); state.issue = res.issue; state.originalIssue=cloneData(res.issue); state.sourceStatus=res.source||state.sourceStatus; state.sourceFingerprint=String(res.source?.fingerprint||state.sourceFingerprint||''); state.historyCurrent=cloneData(res.issue); state.redoStack=[]; state.dirty = false; if (state.audit) state.auditStale = true; renderPages(); renderPage(); renderSourceStatus(); updateStateBadges(); await Promise.allSettled([deleteDraft(),loadIssues(),loadSnapshots()]); broadcastPeer('saved',{issue:state.issue,snapshotId:res.snapshot?.id||''}); if (!silent) toast(\`已保存 · 快照 \${res.snapshot.id}\`); return true; }
  catch (e) { if(e.code==='SOURCE_DRIFT'){toast('服务器制作源已被其他窗口更新，当前修改未覆盖。请重新打开本期后再合并修改。',4200);void refreshSourceStatus({quiet:true});return false;} toast(e.message,2800); return false; }
}`;
          const saveNew=`async function saveIssue({ silent=false }={}) {
  if (!state.issue || !commitPage()) return false; syncMeta();
  if(state.sourceConflict){if(!silent)toast('检测到其他窗口已保存新版本；当前本地稿仍保留，但保存已锁定。请重新打开本期并人工合并后再保存。',5200);return false;}
  const identityRepair = ensureIssueIdentity(state.issue);
  if (identityRepair.changed) { state.identityMigrationPending = true; syncJsonFromPage(); renderPages(); renderBlockList(); }
  const baselineFingerprint=String(state.sourceFingerprint||'');
  try { const res = await api(\`/api/issues/\${state.issue.id}\`, { method:'PUT', body:JSON.stringify({issue:state.issue,sourceFingerprint:baselineFingerprint,editorSessionId:PEER_SESSION_ID}) }); state.issue = res.issue; state.originalIssue=cloneData(res.issue); state.sourceStatus=res.source||state.sourceStatus; state.sourceFingerprint=String(res.source?.fingerprint||baselineFingerprint); state.sourceObservedFingerprint=state.sourceFingerprint; state.sourceConflict=null; state.historyCurrent=cloneData(res.issue); state.redoStack=[]; state.dirty = false; if (state.audit) state.auditStale = true; renderPages(); renderPage(); renderSourceStatus(); updateStateBadges(); await Promise.allSettled([deleteDraft(),loadIssues(),loadSnapshots()]); broadcastPeer('saved',{issue:state.issue,snapshotId:res.snapshot?.id||''}); if (!silent) toast(\`已保存 · 快照 \${res.snapshot.id}\`); return true; }
  catch (e) { if(e.code==='SOURCE_DRIFT'){const latest=String(e.data?.source?.fingerprint||e.source?.fingerprint||'');state.sourceConflict={at:Date.now(),baselineFingerprint,serverFingerprint:latest||state.sourceObservedFingerprint||'',localIssue:cloneData(state.issue)};state.sourceObservedFingerprint=state.sourceConflict.serverFingerprint;toast('服务器制作源已被其他窗口更新。当前本地稿已保留，连续点击保存不会覆盖新稿；请重新打开本期后人工合并。',5600);void refreshSourceStatus({quiet:true,adoptBaseline:false});renderSourceStatus();return false;} toast(e.message,2800); return false; }
}`;
          if(!studio.includes(saveOld))throw new Error('saveIssue contract drifted');studio=studio.replace(saveOld,saveNew);
          studio=studio.replace("title.textContent=`服务器制作源 · 已保护`;\n  text.textContent=`保存前自动创建快照；当前源指纹 ${String(source.fingerprint||'').slice(0,12)||'—'} · ${snapshot} · 保留 ${Number(source.snapshotCount||0)} 个快照。`;","if(state.sourceConflict){title.textContent='检测到并发保存冲突 · 已锁定保存';text.textContent=`本地稿未丢失；编辑基线 ${String(state.sourceFingerprint||'').slice(0,12)||'—'}，服务器最新 ${String(state.sourceObservedFingerprint||source.fingerprint||'').slice(0,12)||'—'}。请重新打开本期并人工合并，刷新状态不会解除锁定。`;return;}\n  title.textContent=`服务器制作源 · 已保护`;\n  text.textContent=`保存前自动创建快照；编辑基线 ${String(state.sourceFingerprint||'').slice(0,12)||'—'} · 服务器观察 ${String(state.sourceObservedFingerprint||source.fingerprint||'').slice(0,12)||'—'} · ${snapshot} · 保留 ${Number(source.snapshotCount||0)} 个快照。`;");
          fs.writeFileSync('src/studio/studio.js',studio);

          let server=fs.readFileSync('scripts/studio-v3.mjs','utf8');
          server=server.replace("const adminLoginEnabled = adminLoginPassword.length > 0;","const adminLoginEnabled = adminLoginPassword.length > 0;\nconst productionMode = process.env.NODE_ENV === 'production' || String(process.env.STUDIO_PRODUCTION || '') === '1';\nif(productionMode&&!acceptanceOnly&&!adminLoginEnabled)throw new Error('正式模式必须配置 STUDIO_ADMIN_PASSWORD；为避免未鉴权启动，服务已拒绝启动。');");
          server=server.replace("const backgroundJobs = new Map();","const backgroundJobs = new Map();\nconst issueWriteLocks = new Map();");
          const insertAt="function send(res,status,data,type='application/json; charset=utf-8',headers={}) {";
          const helper=`async function atomicWriteText(file,text){const dir=path.dirname(file);await mkdir(dir,{recursive:true});const temp=path.join(dir,\`.\${path.basename(file)}.tmp-\${process.pid}-\${randomUUID()}\`);try{await writeFile(temp,text,'utf8');await rename(temp,file);}catch(error){await rm(temp,{force:true}).catch(()=>{});throw error;}}\nasync function withIssueWriteLock(issueId,task){const key=String(issueId);const previous=issueWriteLocks.get(key)||Promise.resolve();let release;const gate=new Promise(resolve=>{release=resolve});const tail=previous.catch(()=>{}).then(()=>gate);issueWriteLocks.set(key,tail);await previous.catch(()=>{});try{return await task();}finally{release();if(issueWriteLocks.get(key)===tail)issueWriteLocks.delete(key);}}\n`;
          if(!server.includes(insertAt))throw new Error('server helper anchor drifted');server=server.replace(insertAt,helper+insertAt);
          const putRe=/if \(seg\.length===3&&req\.method==='PUT'\) \{ const payload=await body\(req\);const data=payload\?\.issue[\s\S]*?return send\(res,200,\{issue:data,snapshot:snap,source\}\); \}/;
          if(!putRe.test(server))throw new Error('server issue PUT contract drifted');
          const putNew=`if (seg.length===3&&req.method==='PUT') { const payload=await body(req);const data=payload?.issue&&typeof payload.issue==='object'&&!Array.isArray(payload.issue)?payload.issue:payload;const protectedEnvelope=Boolean(payload?.issue&&typeof payload.issue==='object'&&!Array.isArray(payload.issue));const expectedFingerprint=String(payload?.sourceFingerprint||'');if(protectedEnvelope&&!expectedFingerprint)return send(res,428,{error:'保存请求缺少编辑基线指纹，请重新打开本期后再保存。',code:'SOURCE_FINGERPRINT_REQUIRED'});return withIssueWriteLock(id,async()=>{const freshIssue=await readJson(issueFile);const currentFingerprint=issueSourceFingerprint(freshIssue);if(expectedFingerprint&&expectedFingerprint!==currentFingerprint)return send(res,409,{error:'服务器制作源已更新；为避免覆盖新内容，本次保存已拒绝。请重新打开本期后再合并修改。',code:'SOURCE_DRIFT',source:await readSourceStatus(id,freshIssue)});try{validateIssue(data,id)}catch(e){return send(res,400,{error:e.message||String(e),code:'VALIDATION_ERROR'})}if(freshIssue.status==='published'&&data.status==='published'){data.revision={...(data.revision||{}),pending:true,updatedAt:new Date().toISOString(),basePublishedAt:freshIssue.publishedAt||null,source:'studio'};}const snap=await snapshotIssue(id,'studio-before-save');await atomicWriteText(issueFile,\`\${JSON.stringify(data,null,2)}\\n\`);await deleteDraftFile(id);await runScriptAsync('sync-assets-v3.mjs',['--issue',id]);const source=await writeSourceReceipt(id,data,{reason:'studio-save',snapshot:snap});return send(res,200,{issue:data,snapshot:snap,source});}); }`;
          server=server.replace(putRe,putNew);
          const acceptOld="if(seg[0]==='api'&&['rc','rc1'].includes(seg[1])&&seg[2]==='acceptance'){\n    if(req.method==='GET')return send(res,200,await readRc1Acceptance());\n    if(req.method==='POST'){";
          const acceptNew="if(seg[0]==='api'&&['rc','rc1'].includes(seg[1])&&seg[2]==='acceptance'){\n    if(req.method==='GET')return send(res,200,await readRc1Acceptance());\n    if(req.method==='POST'){\n      if(!acceptanceOnly){const session=adminSession(req);if(!adminLoginEnabled||!session)return send(res,401,{error:'验收记录写入仅允许验收模式或已认证管理会话',code:'AUTH_REQUIRED'});}";
          if(!server.includes(acceptOld))throw new Error('acceptance route drifted');server=server.replace(acceptOld,acceptNew);
          fs.writeFileSync('scripts/studio-v3.mjs',server);

          let guard=fs.readFileSync('scripts/source-guard-smoke-v3.mjs','utf8');
          const guardAnchor="  assert(conflict.code === 'SOURCE_DRIFT', 'stale source must return SOURCE_DRIFT');\n";
          const guardAdd=`\n  // Re-reading source status must not make the stale editor eligible to overwrite the newer source.\n  response = await fetch(\`\${base}/api/issues/001/source-status\`);\n  const observed = await response.json();\n  assert(observed.fingerprint === saved.source.fingerprint, 'source status should report the newer server version');\n  stale.subtitle = '旧窗口第二次覆盖尝试';\n  response = await fetch(\`\${base}/api/issues/001\`, { method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify({issue:stale,sourceFingerprint:before.fingerprint}) });\n  assert(response.status === 409, 'stale editor must remain rejected after refreshing server status');\n  const afterRetry = JSON.parse(await readFile(path.join(sandbox,'issues','001','issue.json'),'utf8'));\n  assert(afterRetry.subtitle === '服务器已更新', 'repeated stale save must never overwrite newer source');\n  const missingFingerprint = await fetch(\`\${base}/api/issues/001\`, {method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({issue:stale})});\n  assert(missingFingerprint.status === 428, 'protected Studio save without baseline fingerprint must be rejected');\n`;
          if(!guard.includes(guardAnchor))throw new Error('source guard test anchor drifted');guard=guard.replace(guardAnchor,guardAnchor+guardAdd);fs.writeFileSync('scripts/source-guard-smoke-v3.mjs',guard);

          const p0=`import { readFile } from 'node:fs/promises';\nimport { spawn } from 'node:child_process';\nconst assert=(c,m)=>{if(!c)throw new Error(m)};\nconst studio=await readFile('src/studio/studio.js','utf8'),server=await readFile('scripts/studio-v3.mjs','utf8'),ignore=await readFile('.gitignore','utf8');\nassert(studio.includes('sourceObservedFingerprint')&&studio.includes('sourceConflict'),'frontend must separate edit baseline from observed server version');\nassert(studio.includes('if(state.sourceConflict)')&&studio.includes('adoptBaseline:false'),'frontend conflict must remain locked after refresh');\nassert(server.includes('withIssueWriteLock')&&server.includes('atomicWriteText'),'server must serialize and atomically replace issue source');\nassert(server.includes('SOURCE_FINGERPRINT_REQUIRED'),'protected save must require baseline version');\nassert(server.includes('productionMode')&&server.includes('正式模式必须配置 STUDIO_ADMIN_PASSWORD'),'production must fail closed without credentials');\nassert(ignore.includes('.v3-ai-config.json')&&ignore.includes('.v3-ai-cache/'),'local AI secrets/cache must be ignored');\nconst child=spawn(process.execPath,['scripts/studio-v3.mjs','--port','0'],{env:{...process.env,STUDIO_PRODUCTION:'1',STUDIO_ADMIN_PASSWORD:''},stdio:['ignore','pipe','pipe']});let out='';child.stdout.on('data',x=>out+=x);child.stderr.on('data',x=>out+=x);const code=await new Promise(r=>child.on('exit',r));assert(code!==0&&out.includes('STUDIO_ADMIN_PASSWORD'),'production server must refuse to boot without password');\nconsole.log('Plan P0 reliability smoke 通过：冲突基线、写锁/原子写入、正式鉴权与本地配置排除均已固化。');\n`;
          fs.writeFileSync('scripts/plan-p0-reliability-smoke-v3.mjs',p0);
          NODE
          git diff --check
      - name: Verify P0 contracts
        run: |
          node scripts/plan-p0-reliability-smoke-v3.mjs
          node scripts/source-guard-smoke-v3.mjs
          node scripts/admin-auth-smoke-v3.mjs
          node scripts/check-v3.mjs
          node scripts/v31-alpha26-smoke-v3.mjs
      - name: Commit verified P0 changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/plan-p0-reliability.yml
          git add src/studio/studio.js scripts/studio-v3.mjs scripts/source-guard-smoke-v3.mjs scripts/plan-p0-reliability-smoke-v3.mjs
          git commit -m "fix(plan): close source conflict and production auth gaps"
          git push origin HEAD:fix/ci-tts-baseline-20260906
