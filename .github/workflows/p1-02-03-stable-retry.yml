name: P1-02-03 stable retry

on:
  push:
    branches:
      - work/p1-stage-next-2
    paths:
      - .github/workflows/p1-02-03-stable-retry.yml
      - scripts/p1-02-03-rewrite-patcher.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/p1-stage-next-2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply stable P1-02/P1-03 integration
        run: |
          python3 scripts/p1-02-03-rewrite-patcher.py
          python3 scripts/p1-02-03-studio-flow-patch.py
          node --check scripts/studio-v3.mjs
          node --check src/studio/studio.js
          node --check src/reader/reader.js
          node --check src/studio/whole-magazine-templates.js
          git diff --check
      - name: Verify whole-magazine templates
        run: |
          node - <<'NODE'
          import {WHOLE_MAGAZINE_TEMPLATES,applyWholeMagazineTemplate} from './src/studio/whole-magazine-templates.js';
          const assert=(c,m)=>{if(!c)throw new Error(m)};
          assert(WHOLE_MAGAZINE_TEMPLATES.map(x=>x.name).join('|')==='单位综合刊|活动图集|学习专题','required template set changed');
          for(const meta of WHOLE_MAGAZINE_TEMPLATES){
            const base={id:'999',label:'验收期',publication:'验收电子期刊',publisher:'验收单位',subtitle:'模板验收',engine:'v3',status:'draft',assetSource:'issues/999/assets',features:{narration:{pattern:'assets/tts/page-{page}.mp3'}},articles:{},pages:[]};
            const issue=applyWholeMagazineTemplate(meta.id,base);
            assert(issue.pages.length>=12,`${meta.name} is not whole-magazine`);
            assert(issue.pages.filter(p=>p.role==='section').length===4,`${meta.name} section pages missing`);
            assert(issue.brandLock?.enabled,`${meta.name} brand lock missing`);
          }
          console.log('P1-03 PASS');
          NODE
      - name: Verify five-step and three-start flow
        run: |
          node - <<'NODE'
          import {readFile} from 'node:fs/promises';
          const [html,studio,server,reader]=await Promise.all(['src/studio/index.html','src/studio/studio.js','scripts/studio-v3.mjs','src/reader/reader.js'].map(x=>readFile(x,'utf8')));
          const assert=(c,m)=>{if(!c)throw new Error(m)};
          for(const token of ['1 建刊','2 内容','3 排版','4 检查','5 发布'])assert(html.includes(token),`missing ${token}`);
          for(const token of ['value="clone"','value="import"','value="template"'])assert(html.includes(token),`missing ${token}`);
          assert(studio.includes("openImportDialog('file')"),'import start continuation missing');
          assert(server.includes('applyWholeMagazineTemplate')&&server.includes('assertBrandLock'),'server integration missing');
          assert(reader.includes('magazine-page-chrome'),'reader chrome missing');
          console.log('P1-02 PASS');
          NODE
      - name: Commit verified product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/studio/index.html src/studio/studio.js src/studio/studio.css src/studio/whole-magazine-templates.js scripts/studio-v3.mjs src/reader/reader.js src/reader/reader.css
          git commit -m "feat(p1-02-03): add five-step Studio and whole-magazine templates"
          git push origin HEAD:work/p1-stage-next-2
