name: P1-13 dependency security hardening

on:
  push:
    branches:
      - fix/p1-13-dependency-security
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: p1-13-dependency-security
  cancel-in-progress: false

jobs:
  dependency-security:
    runs-on: ubuntu-24.04
    env:
      CHROMIUM: ${{ github.workspace }}/scripts/chrome-ci-wrapper.sh
      V3_REAL_CHROME: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/p1-13-dependency-security
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install locked dependencies and capture baseline audit
        run: |
          npm ci
          npm audit --json > /tmp/audit-before.json || true
          node <<'NODE'
          const fs=require('fs');const a=JSON.parse(fs.readFileSync('/tmp/audit-before.json','utf8'));
          console.log('PRE',JSON.stringify(a.metadata?.vulnerabilities||{}));
          for(const [name,v] of Object.entries(a.vulnerabilities||{})){
            console.log(`VULN ${name} severity=${v.severity} direct=${v.isDirect} range=${v.range} fix=${JSON.stringify(v.fixAvailable)}`);
            for(const via of v.via||[]) if(typeof via==='object') console.log(`  via ${via.source} ${via.title} ${via.range} ${via.url}`);
          }
          NODE

      - name: Apply P1-13 source and test baseline patch
        run: |
          node scripts/p1-13-tiptap-security-patch.mjs
          node --check scripts/p1-13-tiptap-security-patch.mjs
          node --check scripts/p1-13-dependency-security-smoke-v3.mjs
          node --check scripts/v31-alpha22-smoke-v3.mjs
          node --check scripts/v31-alpha221-smoke-v3.mjs
          node --check scripts/v31-alpha22-browser-v3.mjs
          node --check scripts/v31-alpha221-browser-v3.mjs
          node --check scripts/vendor-tiptap-v3.mjs
          node --check src/reader/rich-text.js
          git diff --check

      - name: Upgrade Tiptap security patch line and rebuild lockfile
        run: |
          npm install --ignore-scripts
          git diff --check
          git diff --stat -- package.json package-lock.json

      - name: Rebuild self-hosted Tiptap vendor reproducibly
        run: |
          npm run vendor:tiptap
          npm run test:p1-13
          sha256sum src/reader/vendor/tiptap-runtime.js src/reader/vendor/tiptap-runtime.manifest.json > /tmp/vendor-build-1.sha256
          npm run vendor:tiptap
          npm run test:p1-13
          sha256sum src/reader/vendor/tiptap-runtime.js src/reader/vendor/tiptap-runtime.manifest.json > /tmp/vendor-build-2.sha256
          diff -u /tmp/vendor-build-1.sha256 /tmp/vendor-build-2.sha256
          git diff --check
          git diff --stat -- src/reader/vendor/tiptap-runtime.js src/reader/vendor/tiptap-runtime.manifest.json

      - name: Verify zero moderate/high/critical audit findings
        run: |
          npm audit --json > /tmp/audit-after.json || true
          node <<'NODE'
          const fs=require('fs');const a=JSON.parse(fs.readFileSync('/tmp/audit-after.json','utf8'));
          const v=a.metadata?.vulnerabilities||{};console.log('POST',JSON.stringify(v));
          for(const [name,row] of Object.entries(a.vulnerabilities||{})) console.log(`REMAIN ${name} severity=${row.severity} range=${row.range} fix=${JSON.stringify(row.fixAvailable)}`);
          const blocking=(v.critical||0)+(v.high||0)+(v.moderate||0);
          if(blocking!==0) throw new Error(`P1-13 audit still has critical/high/moderate=${blocking}`);
          NODE

      - name: Rich-text compatibility regression
        run: |
          git config core.fileMode false
          chmod +x scripts/chrome-ci-wrapper.sh
          npm run test:v31-alpha22
          npm run test:v31-alpha22-1
          npm run test:v31-alpha23
          npm run test:v31-alpha24
          npm run test:v31-alpha22-browser
          npm run test:v31-alpha22-1-browser

      - name: Preserve P1 finalization contracts
        run: |
          npm run test:p1-12
          npm run test:p1-11
          npm run test:p1-10
          npm run test:p1-09
          npm run test:p1-07
          npm run test:p1-08
          node scripts/studio-v3.mjs --check
          npm run check:v3
          npm run build:v3
          git diff --check

      - name: Commit security remediation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src/reader/rich-text.js src/reader/vendor/tiptap-runtime.js src/reader/vendor/tiptap-runtime.manifest.json scripts/vendor-tiptap-v3.mjs scripts/v31-alpha22-smoke-v3.mjs scripts/v31-alpha221-smoke-v3.mjs scripts/v31-alpha22-browser-v3.mjs scripts/v31-alpha221-browser-v3.mjs scripts/p1-13-tiptap-security-patch.mjs scripts/p1-13-dependency-security-smoke-v3.mjs
          if git diff --cached --quiet; then
            echo 'P1-13 security remediation already committed and reproducible'
          else
            git commit -m "fix(p1-13): make secured Tiptap vendor reproducible"
            git push origin HEAD:fix/p1-13-dependency-security
          fi
