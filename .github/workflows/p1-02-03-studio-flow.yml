name: P1-02-03 Studio flow and whole templates

on:
  push:
    branches:
      - fix/ci-tts-baseline-20260906
    paths:
      - .github/workflows/p1-02-03-studio-flow.yml
      - scripts/p1-02-03-studio-flow-patch.py
      - src/studio/whole-magazine-templates.js
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ci-tts-baseline-20260906
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply P1-02 and P1-03 integration
        run: |
          python3 scripts/p1-02-03-studio-flow-patch.py
          node --check scripts/studio-v3.mjs
          node --check src/studio/studio.js
          node --check src/reader/reader.js
          node --check src/studio/whole-magazine-templates.js
          git diff --check
      - name: Verify whole-magazine templates
        run: |
          node - <<'NODE'
          import {WHOLE_MAGAZINE_TEMPLATES,applyWholeMagazineTemplate} from './src/studio/whole-magazine-templates.js';
          const assert=(c,m)=>{if(!c)throw new Error(m)};
          assert(WHOLE_MAGAZINE_TEMPLATES.map(x=>x.name).join('|')==='单位综合刊|活动图集|学习专题','required template set changed');
          for(const meta of WHOLE_MAGAZINE_TEMPLATES){
            const base={id:'999',label:'验收期',publication:'验收电子期刊',publisher:'验收单位',subtitle:'模板验收',engine:'v3',status:'draft',assetSource:'issues/999/assets',features:{narration:{pattern:'assets/tts/page-{page}.mp3'}},articles:{},pages:[]};
            const issue=applyWholeMagazineTemplate(meta.id,base);
            assert(issue.pages.length>=12,`${meta.name} is not a whole-magazine template`);
            assert(issue.pages.filter(p=>p.role==='section').length===4,`${meta.name} section pages missing`);
            assert(issue.pages.some(p=>p.chrome?.header)&&issue.pages.some(p=>p.chrome?.footer),`${meta.name} header/footer missing`);
            assert(issue.design?.tokens?.accent===meta.accent,`${meta.name} brand color missing`);
            assert(issue.brandLock?.enabled&&issue.brandLock.lockedFields.includes('design.tokens.accent'),`${meta.name} brand lock missing`);
            const ratios=[];const walk=rows=>(rows||[]).forEach(b=>{if(b?.type==='image')ratios.push(b.frameRatio);if(b?.type==='container')(b.columns||[]).forEach(c=>walk(c.blocks))});issue.pages.forEach(p=>walk(p.blocks));
            assert(ratios.length>=4&&ratios.every(Boolean),`${meta.name} image ratio rules missing`);
          }
          console.log('P1-03 PASS: three whole-magazine templates include section pages, chrome, typography/design tokens, image ratios and brand locking.');
          NODE
      - name: Verify Studio five-step and three-start flow
        run: |
          node - <<'NODE'
          import {readFile} from 'node:fs/promises';
          const [html,studio,server,reader]=await Promise.all(['src/studio/index.html','src/studio/studio.js','scripts/studio-v3.mjs','src/reader/reader.js'].map(x=>readFile(x,'utf8')));
          const assert=(c,m)=>{if(!c)throw new Error(m)};
          for(const token of ['1 建刊','2 内容','3 排版','4 检查','5 发布'])assert(html.includes(token),`five-step flow missing ${token}`);
          for(const token of ['value="clone"','value="import"','value="template"','单位综合刊','活动图集','学习专题'])assert(html.includes(token),`new issue start missing ${token}`);
          assert(studio.includes("openImportDialog('file')"),'import start does not continue into file import');
          assert(server.includes('applyWholeMagazineTemplate')&&server.includes('assertBrandLock'),'server template/brand integration missing');
          assert(reader.includes('magazine-page-chrome'),'Reader does not render template page chrome');
          console.log('P1-02 PASS: build → content → layout → check → publish and three explicit new-issue starts are wired.');
          NODE
      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/p1-02-03-studio-flow.yml scripts/p1-02-03-studio-flow-patch.py
          git add src/studio/index.html src/studio/studio.js src/studio/studio.css src/studio/whole-magazine-templates.js scripts/studio-v3.mjs src/reader/reader.js src/reader/reader.css
          git commit -m "feat(p1-02-03): add five-step Studio and whole-magazine templates"
          git push origin HEAD:fix/ci-tts-baseline-20260906
