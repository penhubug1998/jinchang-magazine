name: P1-04 rich DOCX import

on:
  push:
    branches:
      - feat/p1-04-docx-import
    paths:
      - .github/workflows/p1-04-docx-rich-import.yml
      - scripts/p1-04-docx-rich-import-patch.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p1-04-docx-import
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply P1-04 implementation
        run: |
          python3 scripts/p1-04-docx-rich-import-patch.py
          node --check scripts/lib-v3-import.mjs
          node --check scripts/studio-v3.mjs
          node --check src/studio/studio.js
          node --check src/reader/reader.js
          git diff --check
      - name: Build rich DOCX fixture
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import base64
          root=Path('/tmp/p1-04-fixture')
          root.mkdir(parents=True,exist_ok=True)
          document='''<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
          <w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing">
            <w:body>
              <w:p><w:pPr><w:pStyle w:val="Title"/></w:pPr><w:r><w:t>P1-04 富文本导入验收</w:t></w:r></w:p>
              <w:p><w:r><w:t>普通文字，</w:t></w:r><w:r><w:rPr><w:b/></w:rPr><w:t>粗体文字</w:t></w:r><w:r><w:t>，</w:t></w:r><w:r><w:rPr><w:i/></w:rPr><w:t>斜体文字</w:t></w:r><w:r><w:t>，</w:t></w:r><w:r><w:rPr><w:u w:val="single"/></w:rPr><w:t>下划线文字</w:t></w:r></w:p>
              <w:p><w:r><w:drawing><wp:inline><wp:docPr id="1" name="示例图片" descr="老干部活动现场照片"/><a:graphic><a:graphicData><a:blip r:embed="rIdImg1"/></a:graphicData></a:graphic></wp:inline></w:drawing></w:r></w:p>
              <w:p><w:pPr><w:pStyle w:val="Caption"/></w:pPr><w:r><w:t>图1 老干部活动现场</w:t></w:r></w:p>
              <w:tbl>
                <w:tr><w:tc><w:p><w:r><w:rPr><w:b/></w:rPr><w:t>栏目</w:t></w:r></w:p></w:tc><w:tc><w:p><w:r><w:rPr><w:b/></w:rPr><w:t>内容</w:t></w:r></w:p></w:tc></w:tr>
                <w:tr><w:tc><w:p><w:r><w:t>学习</w:t></w:r></w:p></w:tc><w:tc><w:p><w:r><w:t>理论学习内容</w:t></w:r></w:p></w:tc></w:tr>
              </w:tbl>
              <w:p><w:pPr><w:pStyle w:val="Caption"/></w:pPr><w:r><w:t>表1 学习栏目安排</w:t></w:r></w:p>
              <w:p><w:r><w:t>正文结束。</w:t></w:r></w:p>
            </w:body>
          </w:document>'''
          rels='''<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
          <Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rIdImg1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/image1.png"/></Relationships>'''
          types='''<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Default Extension="png" ContentType="image/png"/></Types>'''
          png=base64.b64decode('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=')
          target=root/'rich.docx'
          with ZipFile(target,'w',ZIP_DEFLATED) as z:
              z.writestr('[Content_Types].xml',types)
              z.writestr('word/document.xml',document)
              z.writestr('word/_rels/document.xml.rels',rels)
              z.writestr('word/media/image1.png',png)
          print(target)
          PY
      - name: Verify DOCX semantics survive parsing and pagination
        run: |
          node - <<'NODE'
          import {readFile} from 'node:fs/promises';
          import {parseImportedBuffer,paginateImportedDocument} from './scripts/lib-v3-import.mjs';
          const assert=(c,m)=>{if(!c)throw new Error(m)};
          const buffer=await readFile('/tmp/p1-04-fixture/rich.docx');
          const doc=await parseImportedBuffer(buffer,{filename:'rich.docx'});
          assert(doc.format==='docx','format mismatch');
          assert(doc.embeddedAssets?.length===1,'embedded image descriptor missing');
          const image=doc.blocks.find(b=>b.type==='image');
          const table=doc.blocks.find(b=>b.type==='table');
          assert(image?.src?.startsWith('embedded://'),'embedded image placeholder missing');
          assert(image.alt==='老干部活动现场照片','image alt text missing');
          assert(image.caption==='图1 老干部活动现场','image caption missing');
          assert(table?.rows?.length===2&&table.rows[1][1]==='理论学习内容','table rows lost');
          assert(table.caption==='表1 学习栏目安排','table caption missing');
          assert(table.headerRows===1,'table header inference missing');
          const marked=doc.blocks.find(b=>b.richText?.type==='doc'&&String(b.text||'').includes('粗体文字'));
          const marks=(marked?.richText?.content||[]).flatMap(n=>n.content||[]).flatMap(n=>n.marks||[]).map(m=>m.type);
          assert(marks.includes('bold'),'bold mark missing');
          assert(marks.includes('italic'),'italic mark missing');
          assert(marks.includes('underline'),'underline mark missing');
          assert(image.sourceRef?.paragraph&&table.sourceRef?.table===1,'source mapping missing');
          const paged=paginateImportedDocument(doc,{structureMode:'article',targetChars:600});
          const all=paged.pages.flatMap(p=>p.blocks||[]);
          assert(all.some(b=>b.type==='image'),'image lost during pagination');
          assert(all.some(b=>b.type==='table'),'table lost during pagination');
          console.log('P1-04 parser PASS',doc.stats,paged.recommendedPages);
          NODE
      - name: Verify Studio Reader and print integration
        run: |
          node - <<'NODE'
          import {readFile} from 'node:fs/promises';
          const [studio,server,reader,css]=await Promise.all(['src/studio/studio.js','scripts/studio-v3.mjs','src/reader/reader.js','src/reader/reader.css'].map(x=>readFile(x,'utf8')));
          const assert=(c,m)=>{if(!c)throw new Error(m)};
          assert(server.includes("'table'")&&server.includes("t==='table'"),'server schema/print table integration missing');
          assert(reader.includes('case "table"')&&css.includes('.table-block'),'Reader table integration missing');
          assert(studio.includes('materializeImportedAssets')&&studio.includes('embeddedAssetFile'),'embedded asset materialization missing');
          assert(studio.includes('table-grid-field')&&studio.includes("case 'table'"),'Studio table editing missing');
          assert(studio.includes("case'table'"),'table narration missing');
          console.log('P1-04 Studio/Reader/PDF integration PASS');
          NODE
      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/lib-v3-import.mjs scripts/studio-v3.mjs src/studio/studio.js src/studio/studio.css src/reader/reader.js src/reader/reader.css
          git commit -m "feat(p1-04): preserve rich DOCX content"
          git push origin HEAD:feat/p1-04-docx-import
