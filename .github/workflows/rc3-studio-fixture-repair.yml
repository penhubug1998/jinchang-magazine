name: RC3 Studio fixture repair

on:
  push:
    branches:
      - fix/ci-tts-baseline-20260906
    paths:
      - .github/workflows/rc3-studio-fixture-repair.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    env:
      CHROMIUM: ${{ github.workspace }}/scripts/chrome-ci-wrapper.sh
      V3_REAL_CHROME: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ci-tts-baseline-20260906
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch Workspace split/maximize and RC3 fixture
        run: |
          node <<'NODE'
          const fs=require('fs');

          // Keep Context Inspector independent from the editor/Reader ratio.
          {
            const file='src/studio/studio.js';
            let src=fs.readFileSync(file,'utf8');
            const old="document.documentElement.style.setProperty('--studio-editor-share',`${value}%`);";
            const next="document.documentElement.style.setProperty('--studio-editor-share',`${value}%`);document.documentElement.style.setProperty('--studio-editor-fr',`${value}fr`);document.documentElement.style.setProperty('--studio-preview-fr',`${100-value}fr`);";
            if(!src.includes(old))throw new Error('Workspace split JS contract drifted');
            src=src.replace(old,next);
            fs.writeFileSync(file,src);
          }
          {
            const file='src/studio/studio.css';
            let src=fs.readFileSync(file,'utf8');
            const rootOld=':root{--studio-side-collapsed-w:72px;--studio-pages-collapsed-w:66px;--studio-editor-share:50%}';
            const rootNew=':root{--studio-side-collapsed-w:72px;--studio-pages-collapsed-w:66px;--studio-editor-share:50%;--studio-editor-fr:50fr;--studio-preview-fr:50fr}';
            if(!src.includes(rootOld))throw new Error('Workspace root split variables drifted');
            src=src.replace(rootOld,rootNew);
            const gridOld='body.workspace-mode #visualEditor{grid-template-columns:minmax(220px,var(--studio-editor-share)) 8px minmax(420px,1fr) 268px!important;gap:6px!important}';
            const gridNew='body.workspace-mode #visualEditor{grid-template-columns:minmax(220px,var(--studio-editor-fr,50fr)) 8px minmax(420px,var(--studio-preview-fr,50fr)) 268px!important;gap:6px!important}';
            if(!src.includes(gridOld))throw new Error('Workspace inspector grid contract drifted');
            src=src.replace(gridOld,gridNew);
            const closedOld='body.workspace-mode.context-inspector-closed #visualEditor{grid-template-columns:minmax(220px,var(--studio-editor-share)) 8px minmax(480px,1fr)!important}';
            const closedNew='body.workspace-mode.context-inspector-closed #visualEditor{grid-template-columns:minmax(220px,var(--studio-editor-fr,50fr)) 8px minmax(480px,var(--studio-preview-fr,50fr))!important}';
            if(!src.includes(closedOld))throw new Error('Workspace closed-inspector grid contract drifted');
            src=src.replace(closedOld,closedNew);
            const maxOld='body.workspace-mode .visual-editor-grid.layout-preview-max{grid-template-columns:0 0 minmax(0,1fr) 0!important}\n  body.workspace-mode .visual-editor-grid.layout-preview-max .context-inspector{display:none!important}\n  body.workspace-mode .visual-editor-grid.layout-preview-max .live-preview-card{grid-column:3!important}';
            const maxNew='body.workspace-mode .visual-editor-grid.layout-preview-max{display:block!important;grid-template-columns:none!important}\n  body.workspace-mode .visual-editor-grid.layout-preview-max .block-canvas,body.workspace-mode .visual-editor-grid.layout-preview-max .editor-preview-splitter,body.workspace-mode .visual-editor-grid.layout-preview-max .context-inspector{display:none!important}\n  body.workspace-mode .visual-editor-grid.layout-preview-max .live-preview-card{display:flex!important;width:100%!important;height:100%!important;grid-column:auto!important}';
            if(!src.includes(maxOld))throw new Error('Workspace preview-max contract drifted');
            src=src.replace(maxOld,maxNew);
            fs.writeFileSync(file,src);
          }

          // Bring historical RC3 browser fixture onto current Studio module graph
          // and the dedicated canvas-only Workspace route.
          {
            const file='scripts/rc3-browser-regression-v3.mjs';
            let src=fs.readFileSync(file,'utf8');
            const loadOld="const [html,css,js]=await Promise.all(['src/studio/index.html','src/studio/studio.css','src/studio/studio.js'].map(f=>readFile(path.join(root,f),'utf8')));";
            const loadNew="const [html,css,js,presetJs]=await Promise.all(['src/studio/index.html','src/studio/studio.css','src/studio/studio.js','src/studio/design-presets.js'].map(f=>readFile(path.join(root,f),'utf8')));const presetUrl='data:text/javascript;base64,'+Buffer.from(presetJs,'utf8').toString('base64');const studioJs=js.replace(/from\\s*['\"]\\.\\/design-presets\\.js(?:\\?[^'\"]*)?['\"]/,`from '${presetUrl}'`);if(/from\\s*['\"]\\.\\/design-presets\\.js/.test(studioJs))throw new Error('RC3 Studio design-presets module rewrite failed');";
            if(!src.includes(loadOld))throw new Error('RC3 Studio load contract drifted');
            src=src.replace(loadOld,loadNew);
            const mockOld='const mock=`<script>window.confirm=()=>true;window.prompt=()=>"manual";';
            const mockNew='const mock=`<script>window.__V3_FORCE_WORKSPACE__=true;window.__V3_APP_BASE_OVERRIDE__="/";window.confirm=()=>true;window.prompt=()=>"manual";';
            if(!src.includes(mockOld))throw new Error('RC3 mock prelude drifted');
            src=src.replace(mockOld,mockNew);
            const injectOld="const injected=html.replace('<link rel=\"stylesheet\" href=\"./studio.css\">',`<style>${css}</style>`).replace('<script type=\"module\" src=\"./studio.js\"></script>',`${mock}<script type=\"module\">${js}</script>`);";
            const injectNew="const injected=html.replace(/<link rel=\"stylesheet\" href=\"\\.\\/studio\\.css(?:\\?[^\"]*)?\">/,`<style>${css}</style>`).replace(/<script type=\"module\" src=\"\\.\\/studio\\.js(?:\\?[^\"]*)?\"><\\/script>/,`${mock}<script type=\"module\">${studioJs}</script>`);";
            if(!src.includes(injectOld))throw new Error('RC3 Studio tag injection contract drifted');
            src=src.replace(injectOld,injectNew);
            const waitOld="for(let i=0;i<120;i++){if(await ev('window.__V3_STUDIO_READY__===true').catch(()=>false))break;await sleep(40)}const assert=(c,m)=>{if(!c)throw new Error(m)};";
            const waitNew="let studioReady=false;for(let i=0;i<160;i++){studioReady=await ev('window.__V3_STUDIO_READY__===true && !!window.__V3_STUDIO__ && window.__V3_STUDIO__.state.workspaceMode===true').catch(()=>false);if(studioReady)break;await sleep(40)}const assert=(c,m)=>{if(!c)throw new Error(m)};assert(studioReady,'RC3 Studio did not become ready in Workspace mode');";
            if(!src.includes(waitOld))throw new Error('RC3 Studio ready wait drifted');
            src=src.replace(waitOld,waitNew);
            const oldCollapsed="const collapsed=await ev(`(()=>{const s=document.querySelector('.sidebar').getBoundingClientRect(),p=document.getElementById('pagesCard').getBoundingClientRect(),b=document.querySelector('.block-canvas').getBoundingClientRect(),r=document.getElementById('previewCard').getBoundingClientRect(),sp=getComputedStyle(document.documentElement).getPropertyValue('--studio-editor-share');return {sidebar:s.width,pages:p.width,editor:b.width,preview:r.width,share:sp,body:document.body.className}})()`);assert(collapsed.sidebar<=80,'sidebar did not collapse');assert(collapsed.pages<=75,'pages panel did not collapse');";
            const newCollapsed="const collapsed=await ev(`(()=>{const s=document.querySelector('.sidebar').getBoundingClientRect(),p=document.getElementById('pagesCard').getBoundingClientRect(),b=document.querySelector('.block-canvas').getBoundingClientRect(),r=document.getElementById('previewCard').getBoundingClientRect(),sp=getComputedStyle(document.documentElement).getPropertyValue('--studio-editor-share');return {sidebar:s.width,pages:p.width,editor:b.width,preview:r.width,share:sp,body:document.body.className}})()`);assert(collapsed.sidebar===0,'workspace management sidebar must stay hidden');assert(collapsed.pages===0,'workspace pages card must stay hidden');assert(collapsed.editor>0&&collapsed.preview>0,`workspace canvas panels missing ${JSON.stringify(collapsed)}`);";
            if(!src.includes(oldCollapsed))throw new Error('RC3 workspace shell assertion contract drifted');
            src=src.replace(oldCollapsed,newCollapsed);
            fs.writeFileSync(file,src);
          }
          NODE
          git diff --check
      - name: Verify Workspace ratio/maximize and RC3 browser regression
        run: |
          chmod +x scripts/chrome-ci-wrapper.sh
          "$V3_REAL_CHROME" --version
          command -v xvfb-run
          node scripts/rc3-smoke-v3.mjs
          node scripts/v31-alpha21-smoke-v3.mjs
          node scripts/v31-alpha26-smoke-v3.mjs
          node scripts/rc3-browser-regression-v3.mjs
      - name: Commit verified source, fixture and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/rc3-studio-fixture-repair.yml
          git add src/studio/studio.js src/studio/studio.css scripts/rc3-browser-regression-v3.mjs
          git commit -m "fix(studio): restore true Workspace split and Reader maximize"
          git push origin HEAD:fix/ci-tts-baseline-20260906
