name: P1-14 GitHub Actions runtime hardening

on:
  push:
    branches:
      - fix/p1-14-actions-runtime
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: p1-14-actions-runtime
  cancel-in-progress: false

jobs:
  actions-runtime:
    runs-on: ubuntu-24.04
    env:
      CHROMIUM: ${{ github.workspace }}/scripts/chrome-ci-wrapper.sh
      V3_REAL_CHROME: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/p1-14-actions-runtime
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install locked dependencies
        run: npm ci

      - name: Migrate Actions runtimes and retire self-mutating stage workflow
        run: |
          python3 scripts/p1-14-actions-runtime-patch.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows
          if git diff --cached --quiet; then
            echo 'P1-14 workflow migration already committed'
          else
            git commit -m "fix(p1-14): upgrade GitHub Actions runtimes"
          fi
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Verify runtime migration contract
        run: |
          python3 scripts/p1-14-actions-runtime-patch.py
          test ! -e .github/workflows/p1-02-03-studio-flow.yml
          if grep -R -n -E 'actions/(checkout|setup-node|upload-artifact)@v4' .github/workflows; then
            echo 'legacy Node 20-backed Action remains' >&2
            exit 1
          fi
          grep -R -q 'actions/checkout@v7' .github/workflows
          grep -R -q 'actions/setup-node@v7' .github/workflows
          grep -R -q 'actions/upload-artifact@v7' .github/workflows
          git diff --check

      - name: Preserve dependency and Final contracts
        run: |
          git config core.fileMode false
          chmod +x scripts/chrome-ci-wrapper.sh
          npm audit --audit-level=moderate
          npm run vendor:tiptap
          npm run test:p1-13
          test -z "$(git status --porcelain --untracked-files=no)"
          npm run test:p1-12
          npm run test:p1-11
          npm run test:p1-10
          npm run test:p1-09
          npm run test:p1-07
          npm run test:p1-08
          node scripts/studio-v3.mjs --check
          npm run check:v3
          npm run build:v3
          git diff --check

      - name: Generate P1-14 runtime receipt
        run: |
          mkdir -p reports
          node <<'NODE'
          const fs=require('fs');const {execFileSync}=require('child_process');
          const commit=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          const receipt={stage:'P1-14',status:'PASS',generatedAt:new Date().toISOString(),sourceCommit:commit,runner:'ubuntu-24.04',node:process.version,actions:{checkout:'v7',setupNode:'v7',uploadArtifact:'v7'},obsoleteWorkflowRetired:'p1-02-03-studio-flow.yml',contracts:['npm audit 0 moderate/high/critical','Tiptap reproducible vendor','P1-12..P1-07 smoke','P1-08 26-checkpoint production E2E','Studio/check/build']};
          fs.writeFileSync('reports/p1-14-actions-runtime.json',JSON.stringify(receipt,null,2)+'\n');
          console.log(JSON.stringify(receipt));
          NODE

      - name: Verify upload-artifact v7
        uses: actions/upload-artifact@v7
        with:
          name: p1-14-actions-runtime
          path: reports/p1-14-actions-runtime.json
          if-no-files-found: error

      - name: Push migrated workflow source
        run: git push origin HEAD:fix/p1-14-actions-runtime
