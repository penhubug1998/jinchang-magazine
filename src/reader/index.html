<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#7a1717">
  <title>离退休干部电子期刊</title>
  <link rel="stylesheet" href="./reader.css?v=3.1.0-ai-link-20260902-06">
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <a class="brand" id="homeLink" href="../../" aria-label="返回期刊总目录">
        <span class="mark">刊</span>
        <span class="brand-copy">
          <strong id="brandTitle">离退休干部电子期刊</strong>
          <small id="brandMeta">加载中…</small>
        </span>
      </a>
      <div class="actions" aria-label="阅读工具">
        <button id="musicButton" class="music-toggle" type="button" title="背景音乐" aria-pressed="false"><svg aria-hidden="true"><use href="#i-music"></use></svg></button>
        <button id="readButton" class="read-toggle" type="button" title="朗读/暂停当前页；Shift+点击打开朗读设置" aria-pressed="false"><svg aria-hidden="true"><use href="#i-speak"></use></svg></button>
        <button id="tocButton" type="button" title="目录"><svg aria-hidden="true"><use href="#i-list"></use></svg></button>
        <button id="fullButton" type="button" title="全屏"><svg aria-hidden="true"><use href="#i-full"></use></svg></button>
      </div>
    </header>

    <main class="reader">
      <button class="nav nav-prev" id="prevButton" type="button" aria-label="上一页">‹</button>
      <section class="stage" id="stage" aria-live="polite" aria-label="电子期刊阅读器"></section>
      <button class="nav nav-next" id="nextButton" type="button" aria-label="下一页">›</button>
    </main>

    <footer class="toolbar">
      <div class="tools" aria-label="翻页">
        <button class="tool" id="prevBottom" type="button" aria-label="上一页"><svg aria-hidden="true"><use href="#i-prev"></use></svg></button>
        <button class="tool" id="nextBottom" type="button" aria-label="下一页"><svg aria-hidden="true"><use href="#i-next"></use></svg></button>
      </div>
      <div class="meta progress-wrap">
        <div class="progress-meta">
          <span id="pageLabel">加载中</span>
          <span id="pageCount">0 / 0</span>
        </div>
        <div class="progress"><i id="progressBar"></i></div>
      </div>
      <div class="tools" aria-label="期刊工具">
        <button class="tool desktop-only" id="homeButton" type="button" aria-label="回到封面" title="回到封面"><svg aria-hidden="true"><use href="#i-home"></use></svg></button>
        <button class="tool" id="bottomTocButton" type="button" aria-label="目录" title="目录"><svg aria-hidden="true"><use href="#i-list"></use></svg></button>
        <button class="tool" id="issueSwitchButton" type="button" aria-label="切换期数" title="切换期数"><svg aria-hidden="true"><use href="#i-swap"></use></svg></button>
        <button class="tool" id="fontButton" type="button" aria-label="调整字号" title="调整字号"><svg aria-hidden="true"><use href="#i-font"></use></svg></button>
      </div>
    </footer>
  </div>

  <svg class="icon-sprite" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-prev" viewBox="0 0 24 24"><path d="M14.5 6 8.5 12l6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="M9.5 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M4.5 11 12 4.5 19.5 11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M6.5 10v9h11v-9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M4 6h3M4 12h3M4 18h3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M9.5 6H20M9.5 12H20M9.5 18H20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18.5V6.2l10-2v12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="7" cy="18" r="2.4" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="17" cy="16.2" r="2.4" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
    <symbol id="i-speak" viewBox="0 0 24 24"><path d="M4.5 9.5v5h3.5l4.5 3.5v-12L8 9.5H4.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M15.5 8.8a4.4 4.4 0 0 1 0 6.4M18 6.4a8 8 0 0 1 0 11.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-font" viewBox="0 0 24 24"><path d="M7 19 11 6h2l4 13M8.6 15h5.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M20.5 8.5v7M17 12h7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-swap" viewBox="0 0 24 24"><path d="M7 8.5h10M15 5l3.5 3.5L15 12M17 15.5H7M9 12l-3.5 3.5L9 19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-full" viewBox="0 0 24 24"><path d="M9 4.5H4.5V9M15 4.5h4.5V9M9 19.5H4.5V15M15 19.5h4.5V15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  </svg>

  <dialog id="tocDialog">
    <div class="dialog-head"><strong>目录</strong><button data-close="tocDialog" type="button">关闭</button></div>
    <div id="tocList" class="toc-list"></div>
  </dialog>

  <dialog id="fontDialog">
    <div class="dialog-head"><strong>阅读字号</strong><button data-close="fontDialog" type="button">关闭</button></div>
    <div class="font-list">
      <button data-font="0.92" type="button">较小</button>
      <button data-font="1" type="button">标准</button>
      <button data-font="1.12" type="button">较大</button>
      <button data-font="1.24" type="button">特大</button>
    </div>
  </dialog>

  <dialog id="readDialog">
    <div class="dialog-head"><strong>有声阅读</strong><button data-close="readDialog" type="button">关闭</button></div>
    <p id="readStatus" class="dialog-copy">未开始朗读。</p>
    <div class="read-settings">
      <label><input id="continuousRead" type="checkbox"> 连续听刊（当前页结束后自动翻页）</label>
      <label>语速
        <select id="speechRate">
          <option value="0.85">0.85×</option>
          <option value="1" selected>1.0×</option>
          <option value="1.15">1.15×</option>
          <option value="1.3">1.3×</option>
        </select>
      </label>
    </div>
    <div class="dialog-actions">
      <button id="readStart" class="primary" type="button">朗读当前页</button>
      <button id="readStop" type="button">停止</button>
    </div>
  </dialog>

  <dialog id="articleDialog">
    <div class="dialog-head"><strong id="articleTitle">链接内容</strong><button data-close="articleDialog" type="button">关闭</button></div>
    <div id="articleBody" class="article-body"></div>
  </dialog>

  <dialog id="issueDialog">
    <div class="dialog-head"><strong>切换期数</strong><button data-close="issueDialog" type="button" aria-label="关闭"><svg aria-hidden="true"><use href="#i-close"></use></svg></button></div>
    <div class="issue-list" id="issueList">
      <a class="issue-link" data-issue-id="001" href="../01/"><b>第一期</b><small>深学铸魂固初心 · 精管护航安伏夏</small></a>
      <a class="issue-link" data-issue-id="002" href="../02/"><b>第二期</b><small>银发丹心映晚晴 · 清风护航伴新秋</small></a>
      <a class="issue-link" data-issue-id="003" href="../03/"><b>第三期</b><small>银发初心映秋色 · 清风正气润晚晴</small></a>
    </div>
  </dialog>


  <div class="video-fs-overlay" id="videoFullscreenOverlay" aria-hidden="true">
    <button class="video-fs-close" id="videoFullscreenClose" type="button" aria-label="退出视频全屏">×</button>
    <div class="video-fs-slot" id="videoFullscreenSlot"></div>
  </div>


  <div id="studioTextToolbar" class="studio-text-toolbar" hidden aria-label="结构化富文本工具栏">
    <button type="button" data-rich-command="undo" title="撤销（Ctrl/Cmd+Z）">↶</button><button type="button" data-rich-command="redo" title="重做（Ctrl/Cmd+Shift+Z）">↷</button>
    <select data-rich-block title="段落类型"><option value="p">正文</option><option value="h1">标题 1</option><option value="h2">标题 2</option><option value="h3">标题 3</option></select>
    <button type="button" data-rich-command="bold" title="粗体"><b>B</b></button><button type="button" data-rich-command="italic" title="斜体"><i>I</i></button><button type="button" data-rich-command="underline" title="下划线"><u>U</u></button>
    <button type="button" data-rich-command="link" title="链接">链接</button><button type="button" data-rich-command="bulletList" title="无序列表">• 列表</button><button type="button" data-rich-command="orderedList" title="有序列表">1. 列表</button><button type="button" data-rich-command="quote" title="引用">❝</button>
    <label class="rich-color" title="文字颜色"><span>A</span><input data-rich-color type="color" value="#3b2d26"></label><button type="button" data-rich-command="highlight" title="高亮">荧光</button>
    <select data-rich-align title="对齐"><option value="left">左对齐</option><option value="center">居中</option><option value="right">右对齐</option><option value="justify">两端</option></select>
    <select data-rich-size title="字号"><option value="">默认字号</option><option value="12px">12</option><option value="14px">14</option><option value="16px">16</option><option value="18px">18</option><option value="20px">20</option><option value="24px">24</option><option value="28px">28</option><option value="32px">32</option><option value="36px">36</option><option value="42px">42</option><option value="48px">48</option></select>
    <button type="button" data-rich-command="clear" title="清除格式">清除</button><span class="rich-engine-badge" id="richEngineBadge">RichText · JSON</span>
  </div>
  <div id="studioRichBubble" class="studio-rich-bubble" hidden aria-label="选区快捷工具栏">
    <button type="button" data-rich-bubble-command="bold" title="粗体"><b>B</b></button>
    <button type="button" data-rich-bubble-command="italic" title="斜体"><i>I</i></button>
    <button type="button" data-rich-bubble-command="underline" title="下划线"><u>U</u></button>
    <button type="button" data-rich-bubble-command="link" title="链接">↗</button>
    <button type="button" data-rich-bubble-command="highlight" title="高亮">▰</button>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <audio id="bgm" loop preload="none"></audio>
  <audio id="narration" preload="none"></audio>
<script type="module" src="./reader.js?v=3.1.0-ai-link-20260902-06"></script>
</body>
</html>
