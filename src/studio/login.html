<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#29221e">
  <title>登录 / 注册 · 电子期刊制作中心</title>
  <!-- 自包含单文件：公开地址 /new-jc-magazine/login 经 nginx 反代到 /login，
       相对资源路径在该前缀下会解析到杂志静态目录，因此样式与脚本一律内联。 -->
  <style>
:root{color-scheme:light;--ink:#302721;--muted:#87786c;--line:#e6d9cb;--paper:#fffdf8;--bg:#f2ece3;--red:#982d29;--red-dark:#70201e}
*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{font-family:Inter,"PingFang SC","Noto Sans CJK SC",system-ui,sans-serif;color:var(--ink);background:radial-gradient(circle at 18% 12%,#fffdf8 0 18%,transparent 45%),linear-gradient(135deg,#eee5db,#f8f4ed);}
.login-shell{min-height:100dvh;display:grid;place-items:center;padding:24px}.login-card{width:min(440px,100%);padding:30px;border:1px solid rgba(150,114,85,.18);border-radius:22px;background:rgba(255,253,248,.94);box-shadow:0 24px 70px rgba(78,54,37,.16)}
.login-brand{display:flex;align-items:center;gap:12px;margin-bottom:34px}.login-mark{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;background:var(--ink);color:#f6d47d;font-family:serif;font-size:24px}.login-brand strong,.login-brand small{display:block}.login-brand strong{font-size:15px}.login-brand small{margin-top:4px;color:var(--muted);font-size:11px}
.eyebrow{font-size:10px;letter-spacing:.16em;color:#a27658}.login-heading h1{margin:8px 0 7px;font-size:28px;line-height:1.2}.login-heading p{margin:0;color:var(--muted);font-size:13px;line-height:1.6}.login-heading{margin-bottom:22px}form{display:grid;gap:14px}label{display:grid;gap:7px;color:#6e5e52;font-size:12px}input{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink);font:inherit;font-size:16px;outline:none}input:focus{border-color:#b6785e;box-shadow:0 0 0 3px rgba(182,120,94,.14)}.login-submit{min-height:45px;margin-top:5px;border:1px solid var(--red);border-radius:11px;background:var(--red);color:#fff;font:600 13px inherit;cursor:pointer}.login-submit:hover{background:var(--red-dark)}.login-submit:disabled{opacity:.62;cursor:wait}.login-status{min-height:20px;margin:0;color:var(--red);font-size:12px;line-height:1.5}.login-status.success{color:#3f765c}.login-note{margin:22px 0 0;padding-top:15px;border-top:1px solid #eee4d9;color:#9a8a7e;font-size:11px;line-height:1.55}
@media(max-width:480px){.login-shell{padding:14px}.login-card{padding:23px;border-radius:18px}.login-brand{margin-bottom:28px}.login-heading h1{font-size:25px}}
.login-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:22px;padding:4px;border:1px solid var(--line);border-radius:13px;background:#f7f1e8}
.login-tab{min-height:40px;border:0;border-radius:10px;background:transparent;color:#7d6c5f;font:600 13px inherit;cursor:pointer}
.login-tab.is-active{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(78,54,37,.09)}
.login-pane[hidden]{display:none}
  </style>
</head>
<body>
  <main class="login-shell">
    <section class="login-card" aria-labelledby="loginTitle">
      <div class="login-brand"><span class="login-mark">刊</span><div><strong>电子期刊制作中心</strong><small>V3.1</small></div></div>
      <div class="login-tabs" role="tablist">
        <button type="button" id="tabLogin" class="login-tab is-active" role="tab" aria-selected="true">登录</button>
        <button type="button" id="tabRegister" class="login-tab" role="tab" aria-selected="false">注册</button>
        <button type="button" id="tabForgot" class="login-tab" role="tab" aria-selected="false">忘记密码</button>
      </div>

      <div id="paneLogin" class="login-pane">
        <div class="login-heading"><span class="eyebrow">SIGN IN</span><h1 id="loginTitle">登录</h1><p>登录后进入你自己的创作空间，制作本单位期刊。</p></div>
        <form id="adminLoginForm" novalidate>
          <label>用户名<input id="adminUsername" name="username" autocomplete="username" required maxlength="32"></label>
          <label>密码<input id="adminPassword" name="password" type="password" autocomplete="current-password" required maxlength="200"></label>
          <button id="adminLoginSubmit" class="login-submit" type="submit">登录</button>
          <p id="adminLoginStatus" class="login-status" role="status" aria-live="polite"></p>
        </form>
      </div>

      <div id="paneRegister" class="login-pane" hidden>
        <div class="login-heading"><span class="eyebrow">REQUEST ACCESS</span><h1>申请账号</h1><p>提交后需要管理员审批，通过后即可登录使用；登录后可设置你自己的期刊名。</p></div>
        <form id="registerForm" novalidate>
          <label>用户名<input id="registerUsername" name="username" autocomplete="username" required maxlength="32" placeholder="3–32 位字母、数字、下划线"></label>
          <label>姓名 / 称呼<input id="registerDisplayName" name="displayName" autocomplete="name" maxlength="60" placeholder="例如：张三"></label>
          <label>密码<input id="registerPassword" name="password" type="password" autocomplete="new-password" required maxlength="200" placeholder="至少 8 位，含字母和数字"></label>
          <label>确认密码<input id="registerPassword2" name="password2" type="password" autocomplete="new-password" required maxlength="200"></label>
          <button id="registerSubmit" class="login-submit" type="submit">提交注册申请</button>
          <p id="registerStatus" class="login-status" role="status" aria-live="polite"></p>
        </form>
      </div>

      <div id="paneForgot" class="login-pane" hidden>
        <div class="login-heading"><span class="eyebrow">RESET PASSWORD</span><h1>忘记密码</h1><p>本系统没有邮件通道：先提交申请，管理员核实身份后给你一次性重置码，再用它设置新密码。</p></div>
        <form id="forgotRequestForm" novalidate>
          <label>用户名<input id="forgotUsername" name="username" autocomplete="username" required maxlength="32" placeholder="你的登录用户名"></label>
          <button id="forgotRequestSubmit" class="login-submit" type="submit">提交重置申请</button>
          <p id="forgotRequestStatus" class="login-status" role="status" aria-live="polite"></p>
        </form>
        <form id="forgotResetForm" novalidate>
          <label>用户名<input id="resetUsername" name="username" autocomplete="username" required maxlength="32"></label>
          <label>一次性重置码<input id="resetCode" name="code" autocomplete="one-time-code" required maxlength="20" placeholder="例如 ABCDE-FGHJK"></label>
          <label>新密码<input id="resetPassword" name="newPassword" type="password" autocomplete="new-password" required maxlength="200" placeholder="至少 8 位，含字母和数字"></label>
          <label>确认新密码<input id="resetPassword2" name="password2" type="password" autocomplete="new-password" required maxlength="200"></label>
          <button id="resetSubmit" class="login-submit" type="submit">用重置码设置新密码</button>
          <p id="resetStatus" class="login-status" role="status" aria-live="polite"></p>
        </form>
      </div>

      <p class="login-note">登录会话有效期 8 小时。期刊名可在登录后随时修改；发布到公开网站需要管理员单独授权。重置码 30 分钟内有效，用过即失效。</p>
    </section>
  </main>
  <script>
// 登录 / 注册页。
//
// 这个页面同时由两个入口提供：
//   1. 应用自身：/login（未登录访问 / 时也回落到它）
//   2. 公开地址：/new-jc-magazine/login（nginx 反代到应用的 /login）
// 因此接口基址不能写死成相对路径——公开地址下相对路径会落到 /new-jc-magazine/api/*。
// 这里按当前路径推导：公开路径 → 走管理端前缀；否则用同级 ./api。
const API_BASE = (() => {
  const path = location.pathname;
  if (path.startsWith('/new-jc-magazine/')) return '/new-jc-magazine-admin/api';
  return new URL('./api', location.href).pathname.replace(/\/$/, '');
})();

const $ = selector => document.querySelector(selector);
const loginForm = $('#adminLoginForm'), userInput = $('#adminUsername'), passwordInput = $('#adminPassword');
const loginSubmit = $('#adminLoginSubmit'), loginStatus = $('#adminLoginStatus');
const registerForm = $('#registerForm'), registerStatus = $('#registerStatus'), registerSubmit = $('#registerSubmit');
const tabLogin = $('#tabLogin'), tabRegister = $('#tabRegister'), tabForgot = $('#tabForgot'), paneLogin = $('#paneLogin'), paneRegister = $('#paneRegister'), paneForgot = $('#paneForgot');
const forgotForm = $('#forgotRequestForm'), forgotStatus = $('#forgotRequestStatus'), forgotSubmit = $('#forgotRequestSubmit');
const resetForm = $('#forgotResetForm'), resetStatus = $('#resetStatus'), resetSubmit = $('#resetSubmit');

function setStatus(node, message, kind = '') { if (!node) return; node.textContent = message; node.className = `login-status ${kind}`.trim(); }
async function readJson(response) { const text = await response.text(); try { return text ? JSON.parse(text) : {}; } catch { return { error: text || response.statusText }; } }

function showTab(which) {
  const login = which === 'login', register = which === 'register', forgot = which === 'forgot';
  tabLogin?.classList.toggle('is-active', login);
  tabRegister?.classList.toggle('is-active', register);
  tabForgot?.classList.toggle('is-active', forgot);
  tabLogin?.setAttribute('aria-selected', String(login));
  tabRegister?.setAttribute('aria-selected', String(register));
  tabForgot?.setAttribute('aria-selected', String(forgot));
  if (paneLogin) paneLogin.hidden = !login;
  if (paneRegister) paneRegister.hidden = !register;
  if (paneForgot) paneForgot.hidden = !forgot;
}
tabLogin?.addEventListener('click', () => showTab('login'));
tabRegister?.addEventListener('click', () => showTab('register'));
tabForgot?.addEventListener('click', () => showTab('forgot'));

async function loadSession() {
  try {
    const response = await fetch(`${API_BASE}/auth/session`, { cache: 'no-store' });
    const data = await readJson(response);
    if (data.authenticated) { location.replace(new URL('./', location.href).pathname); return; }
    if (data.enabled === false) setStatus(loginStatus, '服务器尚未配置账号体系。');
  } catch { setStatus(loginStatus, '无法连接服务器，请稍后重试。'); }
}

loginForm?.addEventListener('submit', async event => {
  event.preventDefault();
  const username = userInput.value.trim(), password = passwordInput.value;
  if (!username || !password) { setStatus(loginStatus, '请输入用户名和密码。'); return; }
  loginSubmit.disabled = true; loginSubmit.textContent = '登录中…'; setStatus(loginStatus, '');
  try {
    const response = await fetch(`${API_BASE}/auth/login`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username, password }) });
    const data = await readJson(response);
    if (!response.ok) throw new Error(data.error || '登录失败');
    setStatus(loginStatus, '登录成功，正在进入制作中心…', 'success');
    location.replace(new URL('./', location.href).pathname);
  } catch (error) {
    setStatus(loginStatus, error.message || '用户名或密码错误。');
    passwordInput.focus();
  } finally {
    loginSubmit.disabled = false; loginSubmit.textContent = '登录';
  }
});

registerForm?.addEventListener('submit', async event => {
  event.preventDefault();
  const username = $('#registerUsername').value.trim();
  const displayName = $('#registerDisplayName').value.trim();
  const password = $('#registerPassword').value;
  const password2 = $('#registerPassword2').value;
  if (!username || !password) { setStatus(registerStatus, '请填写用户名和密码。'); return; }
  if (password !== password2) { setStatus(registerStatus, '两次输入的密码不一致。'); return; }
  registerSubmit.disabled = true; registerSubmit.textContent = '提交中…'; setStatus(registerStatus, '');
  try {
    const response = await fetch(`${API_BASE}/auth/register`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username, password, displayName }) });
    const data = await readJson(response);
    if (!response.ok) throw new Error(data.error || '注册失败');
    registerForm.reset();
    showTab('login');
    userInput.value = username;
    setStatus(loginStatus, data.message || '注册已提交，等待管理员审批通过后即可登录。', 'success');
  } catch (error) {
    setStatus(registerStatus, error.message || '注册失败，请稍后重试。');
  } finally {
    registerSubmit.disabled = false; registerSubmit.textContent = '提交注册申请';
  }
});

forgotForm?.addEventListener('submit', async event => {
  event.preventDefault();
  const username = $('#forgotUsername').value.trim();
  if (!username) { setStatus(forgotStatus, '请填写用户名。'); return; }
  forgotSubmit.disabled = true; forgotSubmit.textContent = '提交中…'; setStatus(forgotStatus, '');
  try {
    const response = await fetch(`${API_BASE}/auth/forgot`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username }) });
    const data = await readJson(response);
    if (!response.ok) throw new Error(data.error || '提交失败');
    $('#resetUsername').value = username;
    setStatus(forgotStatus, data.message || '申请已提交，请联系管理员获取一次性重置码。', 'success');
  } catch (error) {
    setStatus(forgotStatus, error.message || '提交失败，请稍后重试。');
  } finally {
    forgotSubmit.disabled = false; forgotSubmit.textContent = '提交重置申请';
  }
});

resetForm?.addEventListener('submit', async event => {
  event.preventDefault();
  const username = $('#resetUsername').value.trim(), code = $('#resetCode').value.trim();
  const newPassword = $('#resetPassword').value, password2 = $('#resetPassword2').value;
  if (!username || !code || !newPassword) { setStatus(resetStatus, '请填写用户名、重置码和新密码。'); return; }
  if (newPassword !== password2) { setStatus(resetStatus, '两次输入的新密码不一致。'); return; }
  resetSubmit.disabled = true; resetSubmit.textContent = '提交中…'; setStatus(resetStatus, '');
  try {
    const response = await fetch(`${API_BASE}/auth/reset`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username, code, newPassword }) });
    const data = await readJson(response);
    if (!response.ok) throw new Error(data.error || '重置失败');
    resetForm.reset();
    showTab('login');
    userInput.value = username;
    setStatus(loginStatus, data.message || '密码已重设，请用新密码登录。', 'success');
  } catch (error) {
    setStatus(resetStatus, error.message || '重置失败，请重新向管理员申请。');
  } finally {
    resetSubmit.disabled = false; resetSubmit.textContent = '用重置码设置新密码';
  }
});

loadSession();
  </script>
</body>
</html>
